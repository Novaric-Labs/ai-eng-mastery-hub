<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Engineering Mastery Hub — 2026 Edition</title>
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --bg3:#1c2330; --border:#2d333b; --text:#e6edf3;
  --dim:#8b949e; --accent:#58a6ff; --accent2:#bc8cff; --green:#3fb950; --amber:#d29922;
  --red:#f85149; --teal:#39c5cf; --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.55;font-size:15.5px;-webkit-font-smoothing:antialiased;letter-spacing:.005em}
#app{display:flex;min-height:100vh}
#side{width:300px;background:var(--bg2);border-right:1px solid var(--border);padding:22px 16px;position:fixed;top:0;bottom:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
#side::-webkit-scrollbar{width:8px}#side::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
#side h1{font-size:16px;margin-bottom:2px;color:var(--text)}
#side .sub{font-size:11.5px;color:var(--dim);margin-bottom:10px}
.sideprog{margin:0 2px 12px;font-size:11px;color:var(--dim)}
.navbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;margin-bottom:2px;transition:background .15s}
.navbtn:hover{background:var(--bg3)}
.navbtn.active{background:var(--bg3);color:var(--accent);font-weight:600}
.blockhead{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:14px 6px 5px;display:flex;justify-content:space-between;align-items:center}
.blockhead .bm{font-size:10px;padding:1px 7px;border-radius:9px;border:1px solid var(--border)}
.bm.done{color:var(--green);border-color:var(--green)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0}
.dot.read{background:var(--amber)}
.dot.mastered{background:var(--green)}
#main{margin-left:300px;flex:1;padding:38px 50px;max-width:1000px}
.page{animation:fadein .25s ease;max-width:820px}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:26px;margin-bottom:4px;letter-spacing:-.02em;background:linear-gradient(90deg,var(--text),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;display:inline-block}
h3{font-size:17px;margin:22px 0 8px;color:var(--accent)}
h4{font-size:14.5px;margin:14px 0 6px;color:var(--accent2)}
p{margin-bottom:10px;color:var(--text)}
.tagline{color:var(--dim);font-size:14px;margin-bottom:16px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:14px;transition:border-color .2s}
.card:hover{border-color:#3d444d}
.mental{border-left:3px solid var(--accent2);background:linear-gradient(90deg,rgba(188,140,255,.07),transparent);padding:12px 16px;border-radius:0 12px 12px 0;margin:12px 0;font-size:14.5px}
.worked{border-left:3px solid var(--teal);background:linear-gradient(90deg,rgba(57,197,207,.06),transparent);padding:14px 18px;border-radius:0 12px 12px 0;margin:12px 0;font-size:14.5px;color:var(--text)}
.buildbox{border:1px dashed var(--amber);border-radius:12px;padding:14px 18px;margin:12px 0;font-size:14.5px}
.buildbox b{color:var(--amber)}
.pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:10px;margin-right:6px;border:1px solid var(--border);color:var(--dim)}
.pill.new{color:var(--teal);border-color:var(--teal)}
.pill.upd{color:var(--amber);border-color:var(--amber)}
.term{margin-bottom:9px}
.term b{color:var(--text)}
.term span{color:var(--dim)}
ul.flat{list-style:none}
ul.flat li{padding:5px 0 5px 22px;position:relative;color:var(--dim);font-size:14px}
ul.flat li:before{content:"›";position:absolute;left:6px;color:var(--accent)}
ul.flags li:before{content:"⚑";color:var(--red);font-size:12px}
ul.checks li:before{content:"✓";color:var(--green)}
.btn{background:var(--accent);color:#0d1117;border:none;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin:4px 6px 4px 0;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn.green{background:var(--green)}
.btn.amber{background:var(--amber)}
.btn.red{background:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:16px 0 18px;flex-wrap:wrap}
.tab{padding:9px 18px;border:none;background:none;color:var(--dim);cursor:pointer;font-size:14px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:12px 15px;border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:14px;line-height:1.45;transition:border-color .15s,background .15s,transform .1s}
.opt:hover{border-color:var(--accent)}
.opt:hover:not(.right):not(.wrong){transform:translateX(2px)}
.opt.sel{border-color:var(--accent);background:rgba(88,166,255,.12)}
.opt.right{border-color:var(--green);background:rgba(63,185,80,.13)}
.opt.wrong{border-color:var(--red);background:rgba(248,81,73,.12)}
.chip{flex-shrink:0;width:24px;height:24px;border-radius:7px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--dim)}
.opt.right .chip{background:var(--green);color:#0d1117;border-color:var(--green)}
.opt.wrong .chip{background:var(--red);color:#fff;border-color:var(--red)}
.opt.sel .chip{background:var(--accent);color:#0d1117;border-color:var(--accent)}
.exp{font-size:13.5px;color:var(--dim);background:var(--bg3);border-radius:8px;padding:10px 14px;margin:8px 0 16px;border-left:3px solid var(--accent)}
.qnum{font-size:12px;color:var(--dim);margin-bottom:4px}
.qtext{font-size:15px;font-weight:600;margin-bottom:10px}
.bar{height:8px;background:var(--bg3);border-radius:5px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .4s}
.bar i.g{background:var(--green)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.stat .big{font-size:26px;font-weight:700;color:var(--accent)}
.stat .lbl{font-size:12px;color:var(--dim)}
.flipwrap{perspective:1400px;margin-bottom:16px;cursor:pointer}
.flipinner{position:relative;width:100%;min-height:230px;transition:transform .5s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.flipwrap.flipped .flipinner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px 34px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;font-size:17px;line-height:1.5}
.face.front{border-color:#3d444d}
.face.back{transform:rotateY(180deg);color:var(--teal);font-size:15px;border-color:var(--teal)}
.kbd{display:inline-block;background:var(--bg3);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 7px;font-size:11.5px;font-family:ui-monospace,monospace;color:var(--dim)}
.boxtag{font-size:11px;color:var(--dim)}
.scenario-sit{background:var(--bg3);border-radius:8px;padding:13px 16px;margin-bottom:10px;font-size:14.5px}
.model-ans{border-left:3px solid var(--green);background:rgba(63,185,80,.06);padding:12px 16px;border-radius:0 8px 8px 0;margin:10px 0;font-size:14px}
.badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11.5px;font-weight:600;margin-left:8px}
.badge.pass{background:rgba(63,185,80,.15);color:var(--green);border:1px solid var(--green)}
.badge.fail{background:rgba(248,81,73,.12);color:var(--red);border:1px solid var(--red)}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
th,td{border:1px solid var(--border);padding:7px 10px;text-align:left}
th{background:var(--bg3);color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
code{background:var(--bg3);padding:1px 6px;border-radius:5px;font-size:13px;color:var(--teal);font-family:ui-monospace,Menlo,Consolas,monospace}
.res-item{display:block;padding:13px 16px;border:1px solid var(--border);border-radius:11px;margin-bottom:10px;background:var(--bg2);transition:border-color .2s}
.res-item:hover{border-color:var(--accent)}
.res-item a{color:var(--accent);text-decoration:none;font-weight:600;font-size:14.5px}
.res-item a:hover{text-decoration:underline}
.when{display:block;color:var(--dim);font-size:13px;margin-top:3px}
.when b{color:var(--accent2);font-weight:600}
.topbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.actionbar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 35%);padding:18px 0 10px;display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
@media(max-width:860px){#side{position:static;width:100%;height:auto}#app{flex-direction:column}#main{margin-left:0;padding:18px}}
</style>
</head>
<body>
<div id="app">
  <nav id="side"></nav>
  <main id="main"></main>
</div>
<script>
/* ================= DATA ================= */
const BLOCKS=[
 {id:"b1",name:"Block 1 · Foundations"},
 {id:"b2",name:"Block 2 · RAG & Knowledge"},
 {id:"b3",name:"Block 3 · Agents & Harnesses"},
 {id:"b4",name:"Block 4 · Production & Leadership"},
 {id:"b5",name:"Block 5 · Advanced Engineering"}
];
const MODULES=[
{id:"llm",block:"b1",title:"LLM Fundamentals",tag:"Tokens, context, sampling, model families — the vocabulary layer",
 why:"Every AI system you'll oversee is built on an LLM API. Without fluency in tokens, context windows, sampling, and model families, you can't evaluate cost, latency, or quality decisions.",
 mental:"An LLM is a function call to a <b>stateless, slow, expensive, probabilistic, context-bounded</b> text-completion service. Every architectural decision flows from those five adjectives: stateless → pass history yourself; slow → latency budgets and streaming; expensive → cost discipline; probabilistic → evals and guardrails; context-bounded → retrieval and compression.",
 concepts:[
  ["Token","The unit an LLM processes — roughly ¾ of an English word (~4 chars). Pricing, context limits, and latency are all measured in tokens. Fewer per word for code and non-Latin scripts."],
  ["Context window","Max tokens (input + output) per call. June 2026: 1M+ windows are now standard across 13+ hosted frontier models (Claude Fable 5, Opus 4.8, GPT-5.5, Gemini 3.1 Pro); Grok 4 Fast exposes 2M. But filling 1M tokens costs real money ($0.14–$10 per call depending on model) and long context still degrades — 'lost in the middle' didn't disappear."],
  ["Input vs output tokens","Priced separately; output is typically 3–5× more expensive and is where latency comes from (generated one token at a time)."],
  ["Sampling","temperature (randomness), top_p (nucleus), max_tokens, stop sequences. Use temperature OR top_p aggressively, not both. T=0 reduces randomness but is NOT deterministic across calls."],
  ["Model families (June 2026)","Closed: GPT-5.5, Claude Opus 4.8 / Fable 5 / Sonnet 4.6 / Haiku 4.5, Gemini 3.1 Pro, Grok 4.3. Open weights: Llama 4, DeepSeek V4, Qwen 3.5, MiniMax M3, Mistral. Reasoning modes burn extra internal tokens for harder tasks."],
  ["Latency anatomy","TTFT (time to first token) + TPS × output length. Streaming hides TTFT, not total time."],
  ["Prompt caching","Cache the static prefix (system prompt, retrieved docs). Cuts input cost up to 90% on repeated context. The single biggest cost lever after model choice."],
  ["Batch API","~50% discount for async work that can wait. Ideal for nightly evals and bulk classification."]
 ],
 mistakes:["Treating temperature=0 as deterministic — providers don't guarantee bitwise reproducibility","Underestimating output token cost — output dominates the bill","Using premium models for trivial routing/classification","No fallback when the provider has an outage","Not accounting for tokenizer differences across providers when porting prompts — the same text can cost 15–30% more tokens on a different model family","Assuming a 1M window means you should fill it — cost and quality both degrade"],
 flags:["\"We're using the flagship model for everything\" — nobody right-sized","\"We don't track token usage per feature\" — no cost discipline","\"We just call the SDK directly\" — no gateway → no fallback, caching, observability, or model swap","\"We don't version our prompts\" — every change is a silent prod incident"],
 ask:["What's our cost per request, broken into input/output tokens?","Why this model and not the next tier down?","What happens when the provider rate-limits or 5xx's?","What % of our prompt tokens hit the cache?"]},

{id:"prompt",block:"b1",title:"Prompt Engineering",tag:"The cheapest, fastest quality lever you own",
 why:"Prompt changes are free, instant, and routinely worth 10–30 points of task accuracy. It's the first lever to pull before fine-tuning, before switching models, before adding complexity.",
 mental:"A prompt is a <b>program written in natural language, executed by a probabilistic interpreter</b>. Like any program: it needs structure, examples, explicit output contracts, and version control. Unlike any program: it fails silently and gradually, so it needs regression tests (evals).",
 concepts:[
  ["System vs user messages","System prompt sets persistent behavior, constraints, and persona; user messages carry the task. Models weight system instructions heavily — put non-negotiables there."],
  ["Few-shot examples","2–5 input→output examples beat paragraphs of instruction. Examples define format, tone, and edge-case handling implicitly."],
  ["Chain of thought","'Think step by step' or structured reasoning fields measurably improve hard-task accuracy. Native reasoning models internalize this — don't double-prompt them to reason."],
  ["Structured output","JSON schema / function-calling-enforced output. Eliminates parsing failures. Always prefer schema enforcement over 'please respond in JSON'."],
  ["XML/markdown sectioning","Delimit context, instructions, examples, and data with clear tags. Models parse structure far more reliably than prose blobs."],
  ["Prompt versioning","Prompts are code: version-controlled, code-reviewed, eval-gated before deploy. A prompt change without an eval run is a blind deploy."],
  ["Negative instructions","Models follow 'do X' far better than 'don't do Y'. Reframe prohibitions as positive instructions with examples."]
 ],
 mistakes:["Iterating on vibes — changing prompts without an eval set is guessing","One mega-prompt doing five jobs — decompose into focused calls","Stuffing instructions in the user turn that belong in system","Begging for JSON instead of enforcing schema","Prompting reasoning models with elaborate CoT scaffolding they no longer need"],
 flags:["\"The prompt is in the codebase somewhere\" — unversioned, untested","\"We tweaked the prompt and shipped it Friday\" — no regression gate","\"Our prompt is 6,000 tokens\" — likely doing too many jobs, blowing cache efficiency"],
 ask:["Where does this prompt live, and what gates a change to it?","What eval set runs before a prompt change deploys?","Which parts of the prompt are static (cacheable) vs dynamic?"]},

{id:"context",block:"b1",title:"Context Engineering",tag:"Curating what the model sees — the discipline that ate prompt engineering",
 why:"The 2025–26 consensus: managing WHAT goes into the window matters more than wordsmithing instructions. Agents, RAG, memory, and harnesses are all context engineering problems. This doesn't make prompt engineering irrelevant — clear instructions still matter — but in agentic systems, what the model sees outweighs how it's phrased. Think of prompt engineering as designing the instructions; context engineering as deciding what else is in the room when the model reads them.",
 mental:"Treat the context window as <b>RAM, and yourself as the operating system</b>. You decide what gets loaded, what gets paged out, what gets compressed, and what gets fetched on demand. The model only knows what's in RAM right now.",
 concepts:[
  ["Context budget","Allocate the window deliberately: system prompt + tools + retrieved docs + history + scratchpad + output reserve. Track utilization like a memory profiler."],
  ["Lost in the middle","Models attend best to the start and end of context. Put critical instructions at the start, the immediate question at the end; don't bury key facts mid-window."],
  ["Compaction / summarization","When history exceeds budget, summarize older turns into a compact state. This is how agent harnesses (e.g. Claude Code) run long sessions; compaction is lossy — critical state must live in files or structured notes, not only in the summary."],
  ["Just-in-time retrieval","Don't preload everything — give the model tools to fetch what it needs (file reads, search) when it needs it. Agentic search often beats one-shot RAG stuffing."],
  ["Context rot","Quality degrades as windows fill with stale tool output, dead ends, and repetition. Prune aggressively; a clean 30K context beats a noisy 200K one."],
  ["Cache-aware layout","Order context stable→volatile: system prompt and tool defs first (cached), per-request data last. Reordering breaks the cache prefix."],
  ["Sub-agent isolation","Spin off a fresh-context sub-agent for a noisy subtask (e.g. broad search), return only the conclusion. Keeps the main context clean."]
 ],
 mistakes:["Stuffing the window because it fits — cost and accuracy both suffer","Letting raw tool output accumulate unpruned","Putting volatile data before stable data (kills prompt caching)","Relying on compaction alone for critical state — write it to durable artifacts","Preloading 50 documents when the agent could fetch the 2 it needs"],
 flags:["\"Our average request uses 150K context\" — almost certainly unpruned noise","\"We lose track of what the agent did earlier in long sessions\" — no compaction strategy, no progress files","\"Cache hit rate is near zero\" — context layout is volatile-first"],
 ask:["What's our context budget breakdown for a typical request?","How do we handle conversations that outgrow the window?","What's our prompt cache hit rate, and what breaks it?"]},

{id:"landscape",block:"b1",title:"2026 Model Landscape",tag:"Who's who as of June 2026 — and how to choose",isNew:true,
 why:"Model choice is the highest-impact cost and quality decision on any AI project. The landscape shifts quarterly; the decision framework doesn't.",
 mental:"Models are <b>interchangeable commodities behind a gateway; your moat is the harness, evals, and data</b>. Pick per-task tiers, re-benchmark quarterly on YOUR evals (not leaderboards), and keep switching cost near zero.",
 concepts:[
  ["Current flagships (June 2026)","Claude Opus 4.8 (May 2026) leads general intelligence indices; GPT-5.5 (Apr 2026) close behind; Gemini 3.1 Pro (Feb 2026); Grok 4.3 (Apr 2026); Claude Fable 5 GA'd June 9, 2026 as a new tier above Opus."],
  ["Pricing reality","Opus 4.8: ~$5/$25 per M tokens. GPT-5.5: $2.50/$15. Gemini 3.1 Pro: ~$1.25/$5.00 per M tokens; Gemini 2.5 Flash at $0.30/$2.50 is the high-volume budget tier. Open-weight MiniMax M3: ~$0.60 input. Filling the same 1M window: $0.14 (DeepSeek V4 Flash) to $10 (Fable 5) — a 71× spread."],
  ["1M+ context is table stakes","13+ hosted frontier models ship ≥1M windows. The differentiator is no longer window size — it's effective recall across the window, cost to fill it, and latency."],
  ["Reasoning as a dial, not a model","Most flagships now expose adjustable thinking/reasoning effort rather than separate reasoning SKUs. Spend reasoning tokens on hard tasks only."],
  ["Open weights are frontier-adjacent","DeepSeek V4, Qwen 3.5, MiniMax M3, Llama 4 are credible for high-volume, cost-sensitive, or data-residency-bound workloads — if you can fund the MLOps."],
  ["Tiering strategy","Cheap/fast tier (Haiku, Flash, mini) for triage, classification, extraction; mid tier for the workhorse; flagship/reasoning for the hardest 5% of calls. Route, don't default."],
  ["Benchmarks lie (a little)","Leaderboard deltas compress in practice, and harness quality swamps model deltas on agentic tasks. Your own eval suite on your own data is the only score that matters."]
 ],
 mistakes:["Hard-coding one provider's SDK everywhere — no gateway means no leverage","Chasing every release — re-benchmark quarterly, not weekly","Choosing by leaderboard rather than your own evals","Ignoring open-weight options at scale (10–50× unit cost difference)","Buying the flagship for workloads a small model handles at equal accuracy"],
 flags:["\"We can't switch models — too much rework\" — vendor lock-in by architecture","\"We picked it because it tops LMArena\" — nobody validated on real traffic","\"All traffic goes to one model\" — no tiering, no routing"],
 ask:["What would it take to swap providers next week?","When did we last re-benchmark our top 3 routes?","What fraction of calls actually need flagship-tier quality?"]},

{id:"rag",block:"b2",title:"RAG Systems & Pipelines",tag:"The dominant production pattern for grounding models in your data",
 why:"RAG is still the highest-leverage way to make a model answer from YOUR knowledge with citations, freshness, and access control — none of which fine-tuning or long context alone provide.",
 mental:"RAG is a <b>search problem wearing an AI costume</b>. Retrieval quality ceiling-caps answer quality: if the right passage isn't retrieved, no prompt or model fixes it. Invest in search relevance first, generation second.",
 concepts:[
  ["The pipeline","Ingest → chunk → embed → index → (query) retrieve → rerank → assemble context → generate → cite. Every stage has failure modes; instrument each."],
  ["Chunking","Split documents semantically (headings, paragraphs), not at fixed character counts. Typical: 200–800 tokens with overlap or contextual headers. Bad chunking is the #1 silent RAG killer."],
  ["Hybrid retrieval","Dense vectors (semantic) + BM25/keyword (exact terms, IDs, names) + metadata filters. Pure vector search misses part numbers, names, and acronyms; hybrid is the production default."],
  ["Reranking","A cross-encoder reranks the top 50–100 candidates to surface the best 5–10 for the model's context. Cheap, large quality win — the most under-used stage. In practice, retrieval fetches ~50 candidates, the reranker scores them, and the top 5–10 (depending on your context budget) go to generation."],
  ["Query transformation","Rewrite the user's question for retrieval: expansion, decomposition into sub-queries, HyDE. Conversational queries especially need rewriting with history context."],
  ["Agentic RAG","The 2026 evolution: the model decides when and what to search, issues multiple queries, evaluates results, and iterates — retrieval as a tool, not a fixed pre-step."],
  ["RAG vs long context","Long context handles 'analyze this one document'; RAG handles 'answer from a corpus too large/dynamic/permissioned to send'. They compose: retrieve broadly, then load full docs JIT."],
  ["Citations & grounding","Force answers to cite retrieved chunk IDs; reject or flag answers with no supporting chunk. Your main hallucination defense."]
 ],
 mistakes:["Evaluating only the final answer, not retrieval (recall@k) separately","Fixed-size chunking that splits tables and sentences mid-thought","Vector-only search — fails on exact identifiers","No reranker — top-k raw vector hits go straight into context","Ignoring document permissions in retrieval (data leak via RAG)","Skipping freshness: stale index serving deleted/edited docs"],
 flags:["\"Our RAG answers are bad\" with no retrieval metrics — they're debugging blind","\"We chunk at 500 characters\" — arbitrary, format-blind","\"Everyone searches the same index\" — permission model missing"],
 ask:["What's retrieval recall@10 on our golden set?","How do we know when retrieval — not generation — failed?","How fast does an edited document reach the index?","How are document ACLs enforced at query time?"]},

{id:"embed",block:"b2",title:"Embeddings",tag:"Meaning as geometry — the substrate under retrieval",
 why:"Embeddings power retrieval, dedup, clustering, recommendation, and semantic caching. Choosing and operating them well is foundational to every RAG and memory system.",
 mental:"An embedding model is a <b>lossy compression of meaning into a point in space</b>, where distance ≈ semantic similarity. Like any lossy codec, it's tuned for a domain — and mixing codecs corrupts the archive: you can never compare vectors from different models.",
 concepts:[
  ["What they are","Dense vectors (typically 256–3072 dims) from a dedicated embedding model (not your chat LLM). Similar meaning → nearby vectors (cosine similarity)."],
  ["Model choice","OpenAI text-embedding-3, Cohere embed-v4, Voyage, open-weight BGE/GTE/E5. Check the MTEB leaderboard but validate on YOUR retrieval task — domain match beats benchmark rank."],
  ["Dimensions tradeoff","Bigger = better quality, more storage/latency/cost. Matryoshka embeddings let you truncate dims with graceful degradation — store big, query small."],
  ["One model rule","Query and documents MUST use the same embedding model and version. A model upgrade means re-embedding the whole corpus — plan migration like a schema change."],
  ["Asymmetric embedding","Queries and documents are different text types; modern models accept input_type hints (query vs document). Use them."],
  ["Beyond retrieval","Semantic cache (skip duplicate LLM calls), near-dup detection, clustering for topic discovery, anomaly detection on drift."],
  ["Fine-tuned embeddings","For specialized jargon (legal, medical, internal codenames), fine-tuning the embedder lifts recall far more cheaply than fine-tuning the LLM."]
 ],
 mistakes:["Comparing vectors from different models/versions — silent garbage results","Embedding entire documents in one vector — chunk first","Forgetting to re-embed after a model upgrade","Cosine similarity on unnormalized vectors when the index expects normalized","Treating 0.8 similarity as universally 'similar' — thresholds are model- and domain-specific"],
 flags:["\"We upgraded the embedding model last sprint\" + no re-embedding ticket — the index is corrupted","\"Why is similarity weird?\" — usually mixed models or missing input_type","Storage bill growing linearly with docs at 3072 dims — nobody considered truncation"],
 ask:["Which embedding model and version, and where is that pinned?","What's our re-embedding plan for a model upgrade?","Did we evaluate against our domain or just trust MTEB?"]},

{id:"vecdb",block:"b2",title:"Vector Databases",tag:"Approximate search at scale — and when you don't need one",
 why:"The vector DB choice locks in cost, latency, scale ceiling, and operational burden for every retrieval-backed feature. The wrong call is expensive in both directions: overkill and underkill.",
 mental:"A vector DB is <b>a search index, not a database of record</b>. It answers 'what's nearby?' fast by being approximately right (ANN). Source of truth lives elsewhere; the index is rebuildable, disposable infrastructure.",
 concepts:[
  ["ANN algorithms","HNSW (graph, fast queries, RAM-heavy), IVF (cluster-based), ScaNN/DiskANN (disk-scale). All trade recall for speed — tune ef_search/nprobe and MEASURE recall."],
  ["The landscape","Dedicated: Pinecone, Qdrant, Weaviate, Milvus. Bolt-on: pgvector (Postgres), OpenSearch/Elastic, Redis. Embedded: LanceDB, Chroma, FAISS. Bolt-on wins below ~10M vectors if you already run that infra."],
  ["pgvector first","If you run Postgres and have <5–10M vectors, pgvector with HNSW is usually the right answer: one less system, transactions, joins with your relational data, real ACLs."],
  ["Metadata filtering","Pre-filter vs post-filter matters: post-filtering after top-k can return zero results for selective filters. Check how your engine handles filtered ANN."],
  ["Quantization","Scalar/product/binary quantization cuts memory 4–32× with modest recall loss. The difference between a $400 and a $4,000 monthly bill at scale."],
  ["Freshness & deletes","Upserts and deletes in ANN indexes are messy (tombstones, segment merges). Know your engine's consistency lag — it's your stale-answer window."],
  ["Multi-tenancy","Namespace-per-tenant or partition keys; never rely on 'the filter in the prompt' for isolation. Tenant leakage via vector search is a real incident class."]
 ],
 mistakes:["Buying a dedicated vector DB for 200K vectors that fit in pgvector","Never measuring recall of the ANN index against exact search","Post-filtering selective metadata → empty result sets","Treating the vector DB as source of truth — no rebuild path","Ignoring index rebuild/merge windows in latency SLOs"],
 flags:["\"We chose it because it was on Hacker News\" — no requirements analysis","\"Recall? It returns 10 results, so it works\" — accuracy never measured","\"Rebuilding the index takes a week and we're scared\" — no automation"],
 ask:["How many vectors now, and at 10× growth?","What's measured ANN recall vs exact search?","How long until an updated doc is searchable?","Could pgvector do this and remove a system?"]},

{id:"memory",block:"b2",title:"Memory Systems",tag:"State across the stateless — sessions, users, agents",
 why:"The model forgets everything between calls. Every product experience of 'it remembers me' — and every agent that survives a long task — is an engineered memory system you own.",
 mental:"Memory is <b>a write-path problem disguised as a read-path problem</b>. Anyone can retrieve notes; deciding what's worth writing, updating, or deleting — without poisoning future behavior — is the hard part.",
 concepts:[
  ["Memory taxonomy","Working memory (current context), episodic (past conversations/events), semantic (facts about user/domain), procedural (learned how-tos, feedback). Different storage and retrieval for each."],
  ["Short-term: history management","Sliding window + progressive summarization of older turns. Compaction summaries are lossy — pin durable facts elsewhere."],
  ["Long-term: extract-then-store","After conversations, extract candidate facts ('user is vegetarian'), dedupe against existing memory, store with provenance and timestamps. Retrieval-inject relevant memories per request."],
  ["File-based agent memory","The 2026 agent pattern: memory as plain files the agent reads/writes (progress notes, MEMORY.md indexes, scratchpads). Durable, inspectable, harness-portable — and it survives compaction."],
  ["Memory hygiene","Update beats append: contradictions must overwrite, not coexist. TTLs and decay for stale facts. User-visible and editable memory is both a trust and a correctness feature."],
  ["Memory poisoning","Bad writes compound: one wrong extracted 'fact' or an injected instruction stored as memory corrupts every future session. Validate writes; treat memory content as untrusted input on read."],
  ["Tooling","Mem0, Zep, LangMem, or in-house extract+vector store. The frameworks are thin; the design decisions (what to write, when to forget) are yours either way."]
 ],
 mistakes:["Appending forever — context bloat and contradiction soup","Storing raw transcripts as 'memory' instead of extracted facts","No provenance — can't debug why the agent 'believes' something","Letting retrieved memory carry instructions (injection via memory)","No user visibility/control over what's remembered"],
 flags:["\"The agent remembers wrong things and we can't fix it\" — no update/delete path","\"Memory is the last 50 messages\" — that's history, not memory","\"We store everything users say\" — privacy incident pending"],
 ask:["What decides whether something gets written to memory?","How do contradictions get resolved?","Can a user see and edit what's remembered?","Is memory content sanitized before re-entering context?"]},

{id:"agents",block:"b3",title:"AI Agents",tag:"LLMs in a loop with tools — powerful, over-applied, and harness-dependent",
 why:"Agents are the pattern of the moment and the most over-applied. Knowing when a workflow beats an agent — and what makes agents actually reliable — is senior-level judgment.",
 mental:"An agent is <b>an LLM in a while-loop with tools and a goal</b>: model decides → acts via tool → observes result → repeats. Reliability comes from the loop's engineering (the harness), not the model's brilliance. Error compounds per step: 95% per-step success ≈ 36% over 20 steps.",
 concepts:[
  ["Workflow vs agent","Workflow: predefined steps with LLM calls inside (predictable, debuggable, cheap). Agent: model chooses the path (flexible, expensive, harder to bound). Default to workflows; earn your way to agents when paths can't be enumerated."],
  ["The agentic loop","Gather context → plan → act (tool call) → observe → verify → repeat or finish. Verification (tests, checks, self-review) is what separates demos from production."],
  ["Error compounding","Per-step reliability is everything. Mitigations: fewer steps, verification gates, checkpoints/rollback, human approval on irreversible actions."],
  ["Stopping conditions","Max iterations, budget caps, goal tests, and 'declare victory' detection. Agents fail both ways: giving up early and declaring premature success."],
  ["Granular tools beat clever prompts","Agents improve more from better tool design (clear names, descriptions, narrow scopes, good error messages) than from prompt tuning."],
  ["Human-in-the-loop","Approval gates on destructive/irreversible actions (sends, deletes, payments). Autonomy is a dial set per action class, not a switch."],
  ["Observability","Full traces of every step: model calls, tool I/O, decisions. Without traces, agent debugging is archaeology."]
 ],
 mistakes:["Building an agent where a 5-step workflow would do","No iteration/budget caps — runaway loops burn real money","Letting agents take irreversible actions without gates","20 vague tools instead of 8 sharp ones","No verification step — trusting the model's claim of success","Debugging from final output instead of traces"],
 flags:["\"It works in the demo\" — n=1, happy path","\"The agent decides everything\" — autonomy without bounds or audit","\"We can't reproduce failures\" — no tracing"],
 ask:["Why an agent and not a workflow here?","What bounds the loop — iterations, budget, time?","Which actions require human approval?","Show me the trace of the last failure."]},

{id:"tools",block:"b3",title:"Tool / Function Calling",tag:"The hands of the model — API design for a probabilistic caller",
 why:"Tool calling is how models touch the world. Most 'agent bugs' are actually tool-design bugs: vague descriptions, leaky abstractions, unhelpful errors.",
 mental:"Tool definitions are <b>API design where the client is a probabilistic intern</b>: brilliant but easily confused. Crisp names, unambiguous parameters, examples in descriptions, and error messages that teach. The model reads your docs every single call.",
 concepts:[
  ["Mechanics","You send tool schemas (name, description, JSON params) with the request; model returns a structured tool_use call; YOUR code executes it; you return the result; model continues. The model never executes anything — it only asks."],
  ["Description quality","The description is a mini-prompt. Say what the tool does, when to use it, when NOT to, units/formats, and give an example. Most tool-selection errors trace to vague descriptions."],
  ["Tool scope","Match granularity to intent: a search_flights tool, not raw_sql_query. Too broad invites misuse; too narrow forces long chains. Consolidate related operations."],
  ["Error returns","Errors go back INTO context — make them instructive: 'date must be YYYY-MM-DD' beats 'Error 400'. The model self-corrects from good errors and flails on bad ones."],
  ["Parallel & forced calls","Independent calls batch in one turn (parallel) for latency wins. tool_choice can force a specific tool — handy for routing and structured extraction."],
  ["MCP","Model Context Protocol: open standard (now industry-wide) for exposing tools/resources to any model — write a server once, every harness can use it. The USB-C of tool calling."],
  ["Security","Tool calls are attacker-reachable surface: validate args server-side, enforce authz per call (the MODEL is not a principal), idempotency keys on mutations, allowlists over open-ended execution."]
 ],
 mistakes:["Descriptions written for humans who already know the system","Returning raw stack traces or empty errors to the model","Trusting model-supplied args without server-side validation","One mega-tool with a 'command' string param — un-promptable","Ignoring parallel calls — serial latency stacks"],
 flags:["\"The model keeps picking the wrong tool\" — read your descriptions aloud","\"We pass user_id as a tool parameter\" — model-supplied identity = privilege escalation","\"Adding a tool means redeploying everything\" — consider MCP"],
 ask:["Could a new hire pick the right tool from these descriptions alone?","Where is authorization enforced — the tool boundary or model side?","Which tools mutate state, and what makes them safe to retry?"]},

{id:"harness",block:"b3",title:"Agent Harnesses",tag:"The scaffolding around the model — 2026's defining layer",isNew:true,
 why:"The same model scores wildly differently depending on its harness — In documented CORE-Bench evaluations, Opus 4.7 scored 78% in Claude Code's harness vs 42% in a weaker one — a 36-point gap from the same model. Anthropic's own Opus 4.8 release confirmed the pattern: Terminal-Bench scores differ significantly depending on which harness you use. In 2026, harness engineering IS AI engineering: it's where capability actually comes from.",
 mental:"If the model is the CPU, the harness is <b>the operating system</b>: it curates context (RAM), runs the boot sequence (system prompt, hooks), provides drivers (tools, skills), schedules work (loops, sub-agents), and handles persistence (memory, compaction). Same CPU, different OS → wildly different machine.",
 concepts:[
  ["What a harness is","Everything wrapping the model call in an agentic system: system prompt assembly, tool registry, the loop, context management (compaction, pruning), permissions/approvals, tracing, error recovery, checkpoints/resume. The model proposes; the harness disposes."],
  ["The 2026 landscape","Claude Code / Claude Agent SDK (the harness behind Claude Code, opened up for custom agents), OpenAI Agents SDK (major April 2026 upgrade: model-native harness + sandboxed execution, same scaffolding as Codex), LangGraph (explicit graph orchestration), plus lighter frameworks (CrewAI, Strands, Smolagents)."],
  ["Harness > model deltas","On multi-step tasks, harness quality swamps model differences. Benchmark results are model+harness results. When comparing models, hold the harness constant; when buying capability, evaluate the harness first."],
  ["Context management core","The harness's main job: what enters the window each turn. Compaction of old turns, pruning stale tool output, JIT retrieval, sub-agents with fresh windows for noisy subtasks, cache-friendly stable→volatile layout."],
  ["Long-running agents","Work spans many context windows; each session 'wakes up' amnesiac. Anthropic's proven pattern: an initializer agent sets up the environment (init script, feature list as structured JSON, initial commit), then each coding session reads progress notes + git log, picks ONE feature, verifies end-to-end, commits, updates the progress file. Artifacts on disk bridge the amnesia."],
  ["Failure modes harnesses fix","One-shotting (doing too much, dying mid-task with undocumented state) → incremental feature-at-a-time. Premature victory ('looks done!') → explicit pass/fail feature checklist the agent may only flip after verification. Broken-state handoffs → commit clean, log progress, boot-check before new work."],
  ["Hooks, permissions, sandboxing","Production harnesses expose hooks (pre/post tool-call interception), permission tiers per tool/action, and sandboxed execution (filesystem/network isolation) so the agent can act boldly inside a safe boundary."],
  ["Skills & extensibility","Harnesses load capability packs at runtime: skills (instructions + scripts loaded JIT), MCP servers (external tools), sub-agent definitions. Capability becomes configuration, not code change."],
  ["Build vs adopt","Adopt a proven harness (Claude Agent SDK, OpenAI Agents SDK, LangGraph) unless you have hard requirements they can't meet. In-house harnesses recreate years of loop/compaction/permission engineering — usually badly."]
 ],
 mistakes:["Evaluating models without controlling for harness — you benchmarked the scaffolding","Prompting 'build the whole app' instead of structuring incremental, verifiable units","Letting agents mark work done without an end-to-end verification step","Relying on compaction alone for long-task state instead of durable artifacts (progress files, git)","Building a bespoke harness for problems the Agent SDK solved in 2025","No resume capability — a crash at hour 6 restarts at hour 0"],
 flags:["\"We wrote our own agent loop in a weekend\" — wait for the compaction, permissions, and resume bugs","\"The agent says it finished\" — does anything verify that claim?","\"Long tasks mysteriously degrade\" — context rot, no pruning/compaction strategy","\"We switched models and everything broke\" — harness was overfit to one provider"],
 ask:["What's our harness, and why this one?","How does state survive a context-window boundary or crash?","What verifies a step before the agent moves on?","Which actions are sandboxed vs gated on human approval?","If the model improves 20%, what in our harness captures that gain?"]},

{id:"multi",block:"b3",title:"Multi-Agent Systems",tag:"When one context window isn't enough — and the coordination tax",
 why:"Multi-agent is powerful for parallelizable, context-heavy work and wasteful everywhere else. The skill is knowing the difference and paying the coordination tax only when it buys something.",
 mental:"Multi-agent is <b>an org chart for context windows</b>. You hire another agent for the same reason you hire another person: the work exceeds one head. And like orgs, every added agent adds communication overhead, drift risk, and cost — headcount needs justification.",
 concepts:[
  ["Why split","Context isolation (a noisy subtask pollutes the main window), parallelism (independent subtasks fan out), specialization (different tools/prompts per role). NOT because it sounds sophisticated."],
  ["Orchestrator–worker","The proven pattern: a lead agent decomposes the task, spawns workers with focused briefs and fresh contexts, integrates results. Workers return conclusions, not transcripts."],
  ["Handoff quality","Agents communicate through text briefs. Vague briefs → drifted work, duplicated effort. The orchestrator's brief-writing quality is the system's bottleneck — same as human delegation."],
  ["Sub-agents as context tools","The most defensible 2026 use: spawn a fresh-window sub-agent to do a broad noisy search/analysis and return a tight summary. Pure context hygiene."],
  ["Cost multiplier","Multi-agent systems can burn 4–15× the tokens of single-agent on the same task. Reserve for tasks where the value or parallelism justifies it."],
  ["Shared state","Filesystem/artifacts beat message-passing for cross-agent state (durable, inspectable). Concurrent writes need ownership rules — last-write-wins eats work."],
  ["Debugging","One bad handoff cascades. Trace per-agent AND cross-agent; evaluate the system end-to-end, not just each agent in isolation."]
 ],
 mistakes:["Five agents role-playing a company to do one agent's job","Workers inheriting the orchestrator's entire context — no isolation benefit","Two agents editing the same artifact without ownership rules","Evaluating agents individually, never the integrated outcome","Ignoring the token bill until finance asks"],
 flags:["\"We have a researcher, writer, critic, editor, and manager agent\" for a task one good prompt handles","\"Results vary wildly run to run\" — handoff briefs too vague","\"It costs $4 per request\" — coordination tax nobody priced"],
 ask:["What does splitting buy here — isolation, parallelism, or specialization?","What exactly does a worker receive in its brief?","What's the token cost multiple vs single-agent?","How do we evaluate the end-to-end output?"]},

{id:"design",block:"b4",title:"AI System Design",tag:"The full production stack around the model call",
 why:"The model call is 5% of the system. Gateways, caching, queues, fallbacks, observability, and cost controls are the other 95% — and they're what page you at 3am.",
 mental:"Design AI systems like <b>distributed systems with a flaky, expensive, slow dependency at the core</b>. Every classic pattern applies — timeouts, retries, fallbacks, circuit breakers, queues, caches — plus new ones: token budgets, eval gates, and semantic caching.",
 concepts:[
  ["LLM gateway","Single choke point for all model traffic: routing, fallback, retries, rate limiting, caching, cost attribution, key management. LiteLLM, Portkey, Kong AI, or in-house. Non-negotiable beyond one team."],
  ["Fallback chains","Primary model → secondary provider → degraded mode (cached/templated response). Providers have multi-hour outages regularly; design for it."],
  ["Caching layers","Prompt caching (provider-side prefix), exact-match response cache, semantic cache (embedding-similarity hit on paraphrases). Order-of-magnitude cost/latency wins on repetitive traffic."],
  ["Async by default","Anything not interactive goes through queues + batch APIs (50% discount). Reserve synchronous capacity for user-facing paths; stream everything interactive."],
  ["Cost architecture","Token metering per feature/user/route, budgets with alerts, tier routing (cheap model first, escalate on need), max_tokens caps everywhere. Cost is a first-class SLO."],
  ["Observability","Traces for every call (prompt, params, tokens, latency, cost), eval scores on sampled production traffic, drift dashboards. LangSmith, Langfuse, Braintrust, Arize Phoenix, or OTel GenAI conventions."],
  ["Guardrail placement","Input rails (injection screens, PII redaction, topic filters) → model → output rails (schema validation, grounding checks, safety filters). Rails are cheap small-model or rule passes, not flagship calls."],
  ["Versioned everything","Prompts, model IDs, tool schemas, eval sets — pinned and versioned together. 'The model updated and behavior changed' should be a deliberate event, not a surprise."]
 ],
 mistakes:["Calling provider SDKs directly from app code — no gateway","Synchronous calls for batch-shaped work at 2× the price","No per-feature cost attribution until the bill doubles","Retrying non-idempotent agent actions blindly","Pinning nothing — silent model/prompt drift","One global rate limit shared by interactive and batch traffic"],
 flags:["\"The AI bill surprised us\" — no metering or budgets","\"Provider outage = our outage\" — no fallback chain","\"We found out from users\" — no eval sampling on prod traffic"],
 ask:["What happens, step by step, when the primary provider goes down?","What's cost per request by route, and who watches it?","What % of traffic could move to batch/async?","Where are the guardrails, and what do they catch monthly?"]},

{id:"evals",block:"b4",title:"Evaluation & Eval Harnesses",tag:"The discipline that separates shipping from guessing",isUpd:true,
 why:"Probabilistic systems can't be unit-tested into correctness. Evals are how you know quality went up, catch regressions before users do, and ship prompt/model changes with evidence. Teams without evals are flying IFR with no instruments.",
 mental:"Evals are <b>the test suite for behavior</b>: golden datasets are your fixtures, scorers are your assertions, the eval harness is your CI. No eval = no deploy, exactly like no tests = no merge.",
 concepts:[
  ["The eval stack","Golden dataset (curated input→expected pairs, grown from real failures) → scorers (exact match, rubric, model-graded) → harness (runs the suite, reports, gates CI) → production sampling (online evals on live traffic)."],
  ["LLM-as-judge","A model grades outputs against a rubric. Now standard practice — near-human agreement when configured well. Rules: binary judgments beat 1–10 scales, one criterion per judge call, calibrate against human labels periodically, and never let the generating model grade itself ungated."],
  ["Eval harness tooling (2026)","promptfoo (open-source CLI, declarative configs, CI-native, red-teaming built in), Braintrust (managed: instrument→observe→annotate→evaluate→deploy, PR regression comments), LangSmith, DeepEval, Arize Phoenix. Pick one that gates releases — evals that don't block ships are decoration."],
  ["Agentic evals","Score trajectories, not just final answers: did it pick sensible tools, recover from errors, stop appropriately? Plus end-state verification (tests pass, artifact correct). Much harder than single-turn — and where harness quality shows up."],
  ["Component + end-to-end","RAG: eval retrieval (recall@k) separately from generation (faithfulness, relevance). Agents: per-step success AND task completion. Component evals localize blame; end-to-end evals tell the truth."],
  ["Online evals","Sample production traffic, score asynchronously (cheap judge model), alert on drift. Your eval set is always stale; production is the real distribution."],
  ["Failure-driven datasets","Every production failure becomes an eval case. The golden set should grow weekly. 50 hard, real cases beat 5,000 synthetic ones."],
  ["Red-teaming","Adversarial evals: injection attempts, jailbreaks, PII extraction, off-policy requests. promptfoo and dedicated suites automate this; run it like security scanning, on schedule."]
 ],
 mistakes:["Vibes-driven iteration — 'it seems better' is not a metric","1–10 judge scales (noisy) instead of binary/categorical rubrics","Eval set frozen at launch while traffic distribution moves","Testing only happy paths — no adversarial or edge cases","Evals exist but don't gate deploys","Same model generates and judges with no calibration check"],
 flags:["\"How do you know the new prompt is better?\" → silence","\"We eval before big releases\" — should be every change, in CI","\"Our success metric is thumbs-up rate\" — biased, sparse, lagging"],
 ask:["Show me the eval run for the last prompt change.","How many cases, and when did the golden set last grow?","What's judge agreement with human labels?","What samples production, and what alerted last month?"]},

{id:"halluc",block:"b4",title:"Hallucination & Guardrails",tag:"Confidently wrong — engineering around the failure mode that erodes trust",
 why:"Hallucination is intrinsic to next-token prediction: the model is rewarded for fluent, not true. One confidently wrong answer in a legal, medical, or financial flow can erase the product's credibility. You can't eliminate it; you must engineer around it.",
 mental:"Treat every model output as <b>a claim from a brilliant, eager intern with no fear of being wrong</b>. Trust grows only via grounding (citations to sources), verification (checks against truth), and constraint (schemas, allowed values). The system, not the model, is what makes answers trustworthy.",
 concepts:[
  ["Why models hallucinate","Next-token training optimizes plausibility, not truth; the model has no internal fact/fiction boundary. Worst in: niche facts, citations, numbers, recent events, and anything beyond its data."],
  ["Grounding via RAG","Force answers from retrieved sources with chunk-level citations. 'Answer only from the provided context; say I don't know otherwise' — then VERIFY citations exist and support the claim (entailment check)."],
  ["Faithfulness scoring","An LLM-judge or NLI model checks: is each claim in the answer entailed by the retrieved context? Gate or flag low-faithfulness answers. This is the workhorse production defense."],
  ["Structured constraint","Schemas, enums, and allowed-value lists shrink the hallucination surface: a model can't invent a product ID if output is constrained to retrieved IDs."],
  ["Abstention design","'I don't know' must be an acceptable, rewarded output path — in prompts, in UX, in evals. Systems that punish abstention manufacture hallucinations."],
  ["Prompt injection","The other trust failure: instructions hidden in retrieved docs, emails, or web pages hijack the model. Treat ALL external content as untrusted data: delimit it, instruct the model it's data-not-commands, strip suspicious patterns, and never let injected content trigger privileged tool calls without checks."],
  ["Layered guardrails","Input rails (injection screens, PII, topic) → grounded generation → output rails (schema, faithfulness, safety, allowed-claims). Each layer cheap; defense in depth."],
  ["UX honesty","Show sources, confidence cues, and easy escalation to humans. Calibrated trust beats blind trust — design for verification, not authority."]
 ],
 mistakes:["Asking the model 'are you sure?' as the verification strategy","Citations displayed but never validated against content","Prompts that forbid 'I don't know' — abstention punished","Retrieved/email/web content concatenated raw into context (injection highway)","Guardrails only on output — input rails missing","Treating low hallucination on a benchmark as product safety"],
 flags:["\"The model cited a case/paper that doesn't exist\" and nothing caught it","\"Users found the wrong answers\" — no faithfulness gate","\"An email told the agent to forward the inbox and it did\" — no injection defense on tool-using agents"],
 ask:["What checks an answer's claims against its sources?","What happens when the model should say 'I don't know'?","How is retrieved/external content sanitized before the model sees it?","Which guardrail fired most last month, and on what?"]},

{id:"lead",block:"b4",title:"Leadership Playbook",tag:"Judgment, communication, and the meta-skill of staying current",
 why:"Past senior level, your leverage is decisions and narratives: which bets to make, what to tell executives, how to grow a team's AI judgment. Technical depth is the entry fee; this is the differentiator.",
 mental:"Your job is <b>portfolio management of irreversibility</b>: let teams move fast on reversible decisions (prompts, models behind a gateway, retrieval tuning) and slow down hard on one-way doors (data contracts, vendor lock-in, trust-destroying launches, harness rewrites).",
 concepts:[
  ["Build/buy/wait","Buy commodity (gateways, vector DBs, eval platforms, harnesses), build differentiation (domain evals, data pipelines, product UX), wait on hype (most multi-agent, most fine-tuning). Revisit quarterly — 'wait' answers expire."],
  ["The demo-to-prod gap","Demos are the happy path at n=1. Production is adversarial users, edge cases, cost at scale, and 99.5% reliability targets. Budget 3–10× the demo effort; say this out loud at kickoff."],
  ["Executive translation","Frame AI work in risk/cost/revenue, not architecture. 'Faithfulness gating cut wrong-answer escalations 40%' lands; 'we added an NLI entailment check' doesn't. Always pair capability claims with their failure modes."],
  ["ROI discipline","Cost per task × volume vs human-time saved or revenue created, tracked post-launch — not just projected. Kill features whose unit economics never close."],
  ["Team capability","Grow evals-first culture: every engineer writes eval cases; failures become test cases; demos require eval scores. Hire for systems thinking and judgment over framework familiarity — frameworks churn quarterly."],
  ["Responsible deployment","Know your obligations: data residency, PII handling, provenance/disclosure of AI content, human override on consequential decisions, audit trails. Governance done early is cheap; retrofitted, brutal."],
  ["Staying current sustainably","The field turns over quarterly. Protocol: one deep re-implementation per month beats ten skimmed posts; maintain your own eval set to test new models in an afternoon; follow primary sources (provider engineering blogs, model cards) over commentary."]
 ],
 mistakes:["Letting teams build agents before evals exist — backwards","Announcing capabilities to execs without failure modes attached","Treating model choice as permanent (it's a gateway config) while treating data contracts as casual (they're forever)","Hiring framework experts over systems thinkers","Measuring activity (features shipped) over outcomes (task success, unit economics)"],
 flags:["\"We don't have time for evals this quarter\" — you don't have time NOT to","\"The vendor says it's 99% accurate\" — on whose data?","\"We'll add governance after launch\" — translation: after the incident"],
 ask:["Which of our current decisions are one-way doors?","What would falsify our success claim for this feature?","If the flagship model gets 30% better next quarter, what do we delete?","Who on the team can challenge a vendor benchmark with our own numbers?"]},
{
id:"finetune",block:"b5",
title:"Fine-Tuning & Alignment Mechanics",
tag:"When to reshape weights vs when to reshape prompts — and how not to wreck the model",
why:"Fine-tuning unlocks unit economics and behavioral consistency that prompting can't reach at volume. But a mis-scoped fine-tune destroys general capabilities, silently inflates eval scores, and costs weeks to recover from. Staff-level judgment means knowing when the math works and when to stop before the damage compounds.",
mental:"Fine-tuning is <b>surgery on the weight space</b>; prompting is clothing. Both change outputs, but surgery is permanent — you can re-dress a model in 30 seconds, you cannot un-train it on bad data. The decision rule: if a prompted baseline with good few-shot examples achieves acceptable quality, skip the surgery. Fine-tune only when you have a volume, latency, or consistency problem that prompting cannot solve, a clean labeled dataset, and a regression suite ready to run immediately after.",
concepts:[
  ["When fine-tuning beats prompting","Four specific signals: (1) <b>volume</b> — few-shot tokens at 500K req/day cost more than amortized training; (2) <b>latency</b> — eliminating a 2K-token few-shot block cuts TTFT materially; (3) <b>consistency</b> — behavioral style the model drifts from under prompt variation; (4) <b>capability gap</b> — an output format or skill the model genuinely doesn't have. Absent at least one, stop and improve prompts."],
  ["LoRA mechanics","Low-rank decomposition: freeze W (d×k), learn ΔW = A×B where A is d×r and B is r×k, r << min(d,k). Trainable params ≈ 0.5–1% of the full model. Rank r=8–16 for style tasks; r=32–64 for new capabilities. The key insight: model behavior lives in low-rank subspaces — you reshape the behavior without touching the knowledge-bearing full-rank weights. Alternatives worth knowing: DoRA (Weight-Decomposed LoRA) adds a magnitude component and often matches full fine-tune quality at r=8; IA3 (few-parameter prefix-style tuning) is even lighter and useful for style-only adaptation; full fine-tuning remains the ceiling on capability tasks when you have the GPU budget."],
  ["QLoRA","LoRA + 4-bit NF4-quantized base model. Runs a 7B fine-tune on one 24GB GPU where standard LoRA needs 80GB. Cost: ~2–4% quality loss vs full-precision LoRA — negligible for narrow tasks. The practical gate to fine-tuning without A100 budget."],
  ["DPO vs PPO/RLHF","DPO (Direct Preference Optimization): offline, labeled preference pairs (winner/loser), no reward model, no rollouts — trains directly on a Bradley-Terry objective. Simpler, often matches PPO on helpfulness. PPO: train a reward model on preferences, use RL to update the policy against it. Use PPO when your preference signal is complex, conditional, or must generalize to unseen domains; use DPO otherwise."],
  ["What RLHF changes in production","RLHF shapes the <b>behavioral envelope</b> — refusal tone, calibrated hedging, helpfulness style — not raw capability. Capability comes from pretraining. In production, RLHF-tuned models can be LESS capable on specific tasks where safety filters or refusal tendencies fire. Fine-tuning on top of an instruct model without instruction-following examples can erode RLHF alignment."],
  ["Catastrophic forgetting","Continuous fine-tuning overwrites pretraining weight patterns. Mitigations: conservative learning rate for LoRA (1e-4–2e-4 is the standard LoRA range; never use the default Adam lr of 1e-3 with LoRA — it's too high and causes instability); small, clean dataset (less gradient signal); LoRA itself (base frozen by construction); replay (mix 5–10% general pretraining-style samples into the fine-tune batch)."],
  ["Base vs instruct model selection","Instruct model: add a new capability while keeping alignment — the common case. Base model: run a full preference pipeline (SFT → RM → PPO or SFT → DPO) from scratch, or when you need raw next-token completion behavior. Wrong choice: fine-tuning an instruct model on base-style text (no system/user role markup) strips the role-delimiter alignment it was built on."],
  ["Eval methodology for fine-tuned models","Hold-out test split must be drawn BEFORE any labeling or training work — contamination is invisible in loss curves and undetectable after the fact. Contamination signal: eval score suspiciously higher than prompted baseline by >5 points. Additionally: run a regression suite on 3–5 general tasks (instruction following, summarization, Q&A) before calling the fine-tune done."],
  ["The data quality bar","1,000–5,000 high-quality, consistent, edge-case-covering examples beat 100,000 noisy ones. Quality checklist: format consistency (same schema across all examples), factual accuracy (domain expert review), correct task behavior on hard cases, coverage of the failure modes you're trying to fix. Manual review of at least 200 examples is not optional — loss curves cannot catch systematic label errors."]
],
mistakes:[
  "Starting fine-tuning before prompt engineering is fully exhausted — almost always the wrong sequence",
  "Training on a dataset nobody has manually reviewed — systematic label errors are invisible in training loss",
  "Using the default Adam learning rate (1e-3) with LoRA — it is 5–10× too high for adapter training and causes instability and catastrophic forgetting; the correct LoRA range is 1e-4 to 2e-4",
  "No held-out test set defined before training begins — contamination is undetectable after the fact",
  "Measuring loss improvement instead of task metric improvement — the model can memorize format and score zero on content",

  "No version control for the fine-tuned model artifacts alongside the training data and eval set"
],

{
id:"aisec",block:"b5",
title:"AI Security & Adversarial Robustness",
tag:"New attack surfaces, new attack classes — engineering a system that holds under adversarial pressure",
why:"Every LLM feature you ship is a new attack surface. Prompt injection, jailbreaks, and supply-chain attacks in tool results are production incident classes, not theoretical concerns. Staff engineers own the threat model, the pre-launch red-team, and the defense architecture — because no vendor alignment makes a system safe without structural controls you design.",
mental:"Your AI system is a trusted executive who reads every email, including the ones from attackers. <b>Design as if the model cannot be made adversarially robust</b> — because no model resists a sufficiently crafted attack. The controls that hold are structural: external content framed as untrusted data, privileged actions gated independently of anything the model read, and defense-in-depth that doesn't rely on the model's judgment as the last line.",
concepts:[
  ["Direct prompt injection","User-supplied input that contains instructions overriding system behavior. The classic 'ignore prior instructions' family. Mechanically: the model has no instruction/data boundary in token space; it pattern-matches, and a well-crafted user message looks syntactically indistinguishable from a system instruction. Classifiers + positive framing ('your only job is X') reduce exposure; no prompt wording eliminates it."],
  ["Indirect prompt injection","Attacker-controlled content enters through the environment — retrieved documents, emails, web pages, tool results — not through the user's direct input. The agent reads it in the course of a legitimate task. This is an ambient attack requiring no malicious user. Higher severity for agents because tool results automatically carry execution context."],
  ["Multi-hop and multi-modal injection","Multi-hop: a payload planted in memory, a tool result, or an agent handoff activates in a later context. Multi-modal: hidden text in images (white-on-white, adversarial pixels encoding text, image metadata), instructions embedded in audio, or injections in retrieved documents containing figure OCR text."],
  ["Jailbreak pattern families","(1) Prompt wrapping: role-play framing ('pretend you have no restrictions'), fiction laundering ('write a story where a character explains…'); (2) Context inflation: gradually escalate from benign to harmful across a long conversation; (3) Encoding attacks: base64, ROT13, leetspeak to bypass keyword classifiers; (4) Many-shot jailbreaks (MSJA): include many examples of compliance before the harmful request, exploiting in-context learning to override alignment."],
  ["Structured red-team methodology","Threat model first: actor (curious user, external attacker, malicious insider, compromised upstream), motive, capability, entry point. Attack surface enumeration: every channel that feeds external content to the model. Manual probing (human red-teamers are more creative than any fuzzer). Automated sweep: promptfoo red-team mode with injection, jailbreak, and PII-extraction test suites. Run pre-launch and on schedule (quarterly minimum)."],
  ["OWASP LLM Top 10 as a review checklist","LLM01 Prompt Injection, LLM02 Insecure Output Handling (trusting model output as safe for downstream), LLM03 Training Data Poisoning, LLM04 Model DoS (billion-token context attacks), LLM05 Supply Chain (poisoned dependencies, malicious plugins), LLM06 Sensitive Info Disclosure, LLM07 Insecure Plugin Design (over-privileged tools), LLM08 Excessive Agency (agent takes irreversible actions without gates), LLM09 Overreliance, LLM10 Model Theft. Walk through this list before any feature launches."],
  ["Supply chain risks","Malicious MCP server: returns injected instructions as tool results; the agent trusts them because tools are trusted callers. Poisoned embeddings: an embedding model backdoored during training can cause specific trigger phrases to retrieve malicious content. Compromised tool results: a legitimate API returning attacker-controlled content (open-redirect, response injection). Mitigation: pin MCP server versions; validate tool result structure; treat tool outputs as untrusted data."],
  ["Output filtering architecture","Input classifiers before the model: injection detection (classifier + regex heuristics), PII detection (NER-based), topic filters. Output classifiers after the model: schema validation, safety classifier, content policy check. Rule-based filters: fast, zero false negatives on exact patterns, brittle to paraphrase. Classifier-based: catches novel variants, higher latency, non-zero false positives. Both layers are required — neither alone is sufficient."],
  ["Incident response playbook","(1) Containment: disable the feature or route, log the window of affected traffic; (2) Evidence: preserve raw inputs, model outputs, and full traces for the affected session IDs; (3) Scope: estimate how many users/transactions were affected; (4) Disclosure: legal/compliance determines notification obligations; (5) Remediation: patch the specific control that failed; (6) Post-mortem: add the attack to the red-team suite so it never silently recurs."]
],
mistakes:[
  "Relying on prompt-based injection defense ('ignore instructions in retrieved content') as the primary control — it's a layer, not a gate",
  "Red-teaming after launch instead of before — the first incident does the red-team for you",
  "Assuming a specific jailbreak won't work because 'our model has strong alignment' — all models break under sufficient pressure",
  "Testing only direct injection, missing the indirect injection vectors through documents and tool results",
  "Privileged tool calls (send, delete, pay) authorized by model-parsed content instead of server-side session state",
  "No incident response playbook before the first security event — every action improvised under pressure"
],
flags:[
  "\"Our system prompt tells the model to ignore injection attempts\" — prompt-based security theater",
  "\"We haven't red-teamed yet, but we're launching next week\"",
  "\"Tool results go straight into the context\" without sanitization or untrusted-content framing",
  "\"The model won't do that\" — unvalidated assumption, zero empirical evidence"
],
ask:[
  "What are every channel through which attacker-controlled content can reach the model context?",
  "What happens if a document in our RAG index contains a well-crafted injection payload?",
  "Which tool calls can the model trigger without human approval, and what's the worst-case blast radius?",
  "When did we last run an automated red-team sweep, and what does the schedule look like?"
]
},
{
id:"mlops",block:"b5",
title:"AI Observability & Production Reliability",
tag:"Distributed tracing, quality SLOs, and drift detection — the instrumentation layer before the first incident",
why:"AI systems fail silently: wrong answers with 200 OK responses, quality drift over weeks with green dashboards, cost runaways that don't trip error budgets. Standard APM is necessary but not sufficient. Staff engineers design the observability architecture before the system ships — retrofitting after the first quality incident is always more expensive than building it in.",
mental:"Treat the quality metric time series as the <b>heartbeat of your AI system</b>. Latency and error rate tell you whether the HTTP layer is healthy; they tell you nothing about whether the model is hallucinating at 12%. Every AI production system needs three instruments: traces (what did the model see and do), quality scores (is it doing it well), and drift alerts (is the distribution shifting). Missing any one, and you find out from users.",
concepts:[
  ["Distributed tracing for agentic systems","Standard HTTP spans capture the network call. AI-specific span attributes (OpenTelemetry GenAI semantic conventions): <code>gen_ai.system</code>, <code>gen_ai.request.model</code>, <code>gen_ai.usage.input_tokens</code>, <code>gen_ai.usage.output_tokens</code>. Custom attributes for agent loops: <code>cost_usd</code>, <code>tool_call_name</code>, <code>trajectory_id</code> (shared across all turns in one agent session), <code>loop_iteration</code>. Every tool call is a child span; sub-agent invocations are linked traces. Without trajectory_id, debugging a multi-turn agent failure is archaeology."],
  ["SLOs for probabilistic systems","Latency SLOs (p50/p95/p99) work unchanged. Quality SLOs require a measurable metric: <code>faithfulness_rate</code> (from async online eval scoring), <code>task_success_rate</code>, <code>abstention_rate</code>. Define error budget as: X% of traffic allowed below the quality threshold per rolling week. The discipline of writing down 'we will alert if faithfulness_rate drops below 82% on a 7-day rolling window' forces you to define what quality means before shipping."],
  ["Online eval sampling pipelines","Sample 2–5% of production traffic into an async queue. Score each sample with a cheap judge model (different family from the generator). Write scores + trace IDs to a time-series store. Alert on rolling-average regression (7-day window, threshold drift > 3 points from 30-day baseline). This is the only instrument that catches quality degradation before users do."],
  ["Behavioral drift vs data distribution drift vs performance drift","<b>Behavioral drift</b>: model output distribution changed — detect via semantic embedding shift in sampled responses (KL divergence or drift distance on response embedding centroids). <b>Data distribution drift</b>: incoming query distribution shifted — detect via embedding shift in input queries. <b>Performance drift</b>: quality metric dropped — detect via online eval score series. These have different causes and different responses: performance drift is the alert to action; behavioral and data drift are the diagnosis."],
  ["Canary and shadow deployment for AI","<b>Canary</b>: route 5% of traffic to the new version, score both canary and control via async evals, auto-rollback if canary quality score drops more than N points vs control. The AI difference from standard software canaries: error rates alone won't catch a prompt regression that answers confidently but wrongly. <b>Shadow</b>: route 100% of traffic to both versions, compare quality scores offline without serving shadow responses. Use shadow for high-risk changes."],
  ["Incident playbooks for AI-specific failure modes","<b>Hallucination spike</b>: faithfulness_rate alert triggers, sample 50 affected traces, check if a model alias auto-upgraded or prompt changed, disable feature if rate > 2× baseline. <b>Cost runaway</b>: per-route budget alert, check output token growth and cache hit rate drop, identify the route. <b>Prompt injection event</b>: quarantine affected session IDs, identify what was served to whom, evidence preservation before remediation. Each playbook should exist before the incident, not be written during it."],
  ["AI-ready monitoring vs bolt-on APM","Standard APM: requests/errors/latency — necessary but not sufficient. AI-ready adds: (1) quality metric time series from async eval scoring; (2) per-route cost metrics (USD/request with alert thresholds); (3) semantic drift dashboards for inputs and outputs; (4) model version and prompt version tracking; (5) token utilization breakdown (input/output, cached/uncached). Langfuse, Arize Phoenix, and Braintrust all provide this; OpenTelemetry GenAI conventions let you build it yourself into any OTEL backend."]
],
mistakes:[
  "Monitoring only latency and error rate — correct latency with wrong answers is undetected by both",
  "SLOs defined exclusively on infrastructure metrics; quality SLOs not written down before launch",
  "Detecting quality degradation from support tickets rather than from monitoring — users are a lagging, biased instrument",
  "Canary deployments that check error rates without checking quality scores on canary vs control traffic",
  "No trajectory IDs in traces — multi-turn agent failures can't be reconstructed from individual span logs",
  "Retrofitting observability after the first quality incident, treating it as optional infrastructure"
],
flags:[
  "\"The dashboards look green\" when only latency and error rate are on the dashboard",
  "\"We found out from support tickets that quality dropped\" — no quality monitoring",
  "\"We can't trace what the agent did on that specific request\" — no trajectory IDs",
  "\"We deploy AI prompt changes the same way as API bug fixes\" — no quality canary"
],
ask:[
  "What is the quality metric for this feature, and what value triggers an alert?",
  "Can you pull a complete trace for any specific user interaction, including every model call and tool result?",
  "What percentage of production traffic is scored asynchronously for quality, and how often?",
  "What does the on-call playbook say to do when the faithfulness rate alert fires?"
]
},
{
id:"dataeng",block:"b5",
title:"Data Engineering for AI Systems",
tag:"The pipeline that determines retrieval ceiling — chunking, embedding lifecycle, and the data flywheel",
why:"The model and the retrieval system are only as good as the data pipeline feeding them. Bad chunking, mixed embedding versions, stale ACLs, and missing re-indexing triggers silently cap quality at 60–70% before a single prompt is written. Staff engineers design the data architecture so the retrieval system gets better automatically over time — not better manually every quarter.",
mental:"The data pipeline is <b>the invisible quality ceiling</b>. Every downstream optimization — better models, better prompts, better rerankers — operates on whatever your pipeline hands them. A table split across two chunks, a stale document served as current, or an embedding model mismatch produces plausible-looking garbage with no error signal. Design the pipeline as if retrieval quality is a function of pipeline correctness first, model quality second.",
concepts:[
  ["Document preprocessing pipelines","OCR quality gates: Tesseract fails on low-resolution, handwritten, and complex-layout scanned docs; commercial APIs (AWS Textract, Azure Form Recognizer, Reducto.ai) handle structured layouts but are expensive. Score OCR confidence per page and quarantine low-confidence pages for human review rather than silently ingesting garbage. Structure extraction: layout detection models (LayoutLMv3, Microsoft Table Transformer) to locate tables, headers, and figures before chunking. Normalization: Unicode normalization, header deduplication, whitespace and formatting artifact removal."],
  ["Chunking strategy design","<b>Fixed-size</b> (e.g., 512 tokens / 50-token overlap): fast, breaks semantic units, catastrophically fragments tables. Never use as the default. <b>Semantic chunking</b>: split at low-similarity sentence transitions (sentence-transformers to detect boundary points). <b>Hierarchical</b>: parent (section, ~1500 tokens) + child (paragraph, ~400 tokens); retrieve on child granularity, return parent for generation context — balances retrieval precision with generation context richness. <b>Late chunking</b>: embed the full document, pool sub-embeddings from full-context representations; preserves inter-chunk context ('the regulation described above') in the embedding itself."],
  ["Parent-child retrieval","Retrieve at child granularity (precise vector match), serve parent context to the model (full section with surrounding material). LlamaIndex ParentDocumentRetriever implements this. The concrete win: a 400-token child chunk retrieves with high precision; the 1500-token parent gives the model the surrounding context it needs to answer correctly. Without this, precision and recall trade off with a single chunk size."],
  ["Embedding pipeline reliability","Version the embedding model as a first-class artifact — store model ID + version in index metadata, raise a hard error on startup if the deployed embedder mismatches the index. Re-embedding triggers: model upgrade (always), significant format change, domain shift detected via recall regression. Blue-green migration: build the new index while the old one serves, run recall comparison on the golden query set, atomic alias swap. Never mix versions in the same index."],
