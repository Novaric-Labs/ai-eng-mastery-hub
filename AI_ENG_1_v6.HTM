  ["Data flywheel design","Production failures → labeling queue → eval cases → (eventually) training signal. Pipeline: failure detection (low faithfulness score, user thumbs-down, empty retrieval result) → automatic sampling into a labeling queue → human labeling with a rubric → permanent eval case added to the golden set → quarterly review for training signal. The flywheel means the system gets measurably better every week without a dedicated improvement sprint."],
  ["Synthetic data generation","<b>Safe for</b>: expanding eval coverage of rare but real query types; generating diverse phrasings of documented facts (backtranslation: answer → question generation). <b>Creates false confidence when used for</b>: training data on factual domains — the generator hallucinates facts into training examples. Adversarial filtering: generate a large pool, filter with a binary judge (factually grounded? diverse from existing set?), keep the top 20%. Never use raw model-generated synthetic data as training data without this filter."],
  ["Knowledge graph integration","Entity extraction (spaCy, custom NER) → graph construction (Neo4j, or in-process with networkx). Hybrid retrieval: vector for semantic similarity, graph for multi-hop relationships ('find the manager's direct reports' cannot be answered by cosine similarity alone). Entity disambiguation: 'Apple' in 'Apple vs Samsung' is AAPL; in 'apple allergy' it's the fruit — graphs store canonical entities and their context. Use graph traversal when queries require relationship chains that span multiple documents."],
  ["Data quality dimensions for RAG","<b>Freshness</b>: track last-modified timestamp per chunk; alert when chunks exceed the freshness SLA (e.g., >72 hours behind source). <b>Access control propagation</b>: when source document permissions change, the change must propagate to all derived chunks within a defined window — stale ACLs leak restricted content. <b>Deduplication</b>: SimHash or MinHash LSH at ingestion to avoid duplicate chunks boosting a single source's retrieval weight; deduplicate top-k results before reranking."]
],
mistakes:[
  "Fixed-size chunking as the production default — splits tables, clauses, and numbered lists at arbitrary boundaries",
  "No version tracking on the embedding model used to build each index — silent quality collapse on any dependency update",
  "Tables ingested as raw text, losing row/column relationships entirely",
  "No freshness tracking — stale documents served as current with no staleness signal to the model or user",
  "Synthetic training data generated without adversarial filtering — hallucinations baked into training signal",
  "ACL propagation not implemented — permissions change on the source, chunks remain accessible to unauthorized users"
],
flags:[
  "\"We chunk at 512 characters\" — arbitrary, format-blind, table-destroying",
  "\"We ingested all our documents at launch and re-ingest monthly\"",
  "\"The embedding model is just a dependency in requirements.txt\" — not pinned as an artifact with index metadata",
  "\"Tables aren't really a problem for us\" — hasn't looked at what the pipeline actually produces for tables"
],
ask:[
  "How are table structures preserved through the chunking pipeline? Show me a table from a real document post-chunking.",
  "What triggers a document chunk to be re-indexed after the source document is updated?",
  "How does the chunk's access control map to the source document's permissions, and what's the propagation latency?",
  "What is the pipeline from a production retrieval failure to a permanent eval case?"
]
},
{
id:"multimodal",block:"b5",
title:"Multimodal Systems & Document Intelligence",
tag:"Vision-language pipelines, document ingestion at scale, and when to pay for vision vs when to skip it",
why:"Enterprise document workflows — insurance claims, legal filings, financial reports, technical manuals — contain tables, figures, and scanned content that text-only pipelines handle badly. Building multimodal document intelligence that's reliable at scale requires knowing when vision adds value, when it's expensive theater, and how to route between pipelines based on document type rather than treating everything the same.",
mental:"Vision-language models are <b>an expensive retrieval upgrade for content your text pipeline can't see</b>. The question is never 'can the model handle images?' — it can. The question is: does the value of what vision recovers (a table structure, a figure's data, handwritten annotations) justify 3–5× the cost and latency vs text extraction? For digital-native PDFs with clean text layers, the answer is almost always no. Route first, vision second.",
concepts:[
  ["Vision-language model selection in 2026","<b>Claude Opus 4.8 / GPT-5.5 class</b>: best for complex mixed-layout documents, structured data extraction from tables, figure understanding. <b>Gemini 3.1 Pro</b>: strong multimodal at competitive pricing; long-context advantage for multi-page documents. <b>Open-weight</b> (Llama 4 Vision, InternVL2, Qwen2-VL): viable for high-volume, cost-sensitive, or data-residency-bound workloads with self-hosting budget. Cost profile: a single 1000×1000px page ≈ 800–1600 image tokens (model-dependent) — 3–5× the cost of equivalent text extraction on digital-native PDFs."],
  ["PDF and document ingestion pipeline design","<b>Digital-native PDFs</b>: pdfminer.six or pypdf for text extraction — fast, free, accurate. Never send these to a vision model. <b>Scanned PDFs</b>: AWS Textract, Azure Form Recognizer, or Google Document AI for production; Tesseract for low-budget. Score OCR confidence per page; quarantine pages below 0.7 confidence for human review. <b>Layout detection</b>: LayoutLMv3 or Detectron2-based models to locate tables, headers, figures before extracting. <b>Table extraction</b>: Microsoft Table Transformer (TATR) — locate table regions, then extract structure with row/column relationships preserved. Camelot (rule-based) works only on digital-native, fails on scanned."],
  ["Audio input patterns","<b>Transcribe first</b> (Whisper large-v3, ~$0.006/min, WER 2–4% on clear audio): enables all text-side processing — chunking, retrieval, structured extraction. Best for most use cases. <b>Pass raw audio to multimodal model</b>: necessary when the task requires speaker identity (diarization, pyannote-audio), prosodic cues (emotion, emphasis, hesitation), or acoustic environment analysis. Cost: raw audio calls to frontier models are significantly more expensive than transcription + text call. The routing decision: does the task require audio-native signals, or just what was said?"],
  ["Structured data as context","<b>NL2SQL</b>: include the relevant table schemas (not all 500 tables) in context alongside the user question; retrieve relevant tables first via schema embedding similarity. For large databases (>50 tables), schema filtering is mandatory — attention can't find the right JOIN across 500 schemas. <b>CSV in context</b>: tables under ~150 rows can be included directly; larger tables need code execution (pandas) or NL2SQL. <b>Schema-in-context tradeoffs</b>: full schema enables flexible queries but consumes context budget; filtered schema is cheaper but may miss needed tables."],
  ["Cross-modal eval design","End-to-end task accuracy is insufficient — it hides which modality failed. Separate metrics: (1) <b>OCR accuracy</b>: character error rate on a held-out set of scanned documents; (2) <b>Table extraction precision</b>: % of cells correctly extracted with correct row/column assignment; (3) <b>Figure understanding accuracy</b>: key data points correctly identified from charts; (4) <b>Answer faithfulness</b>: standard RAG faithfulness metric on the final answers. Component metrics localize failures; end-to-end tells the user's truth."],
  ["When multimodal beats text-only","Complex tables where structure is visual (spanning cells, nested headers) — text extraction loses relationships. Figures and charts where the data is not present in the surrounding text. Handwritten annotations. Scanned documents where OCR quality is insufficient for precise extraction but a VLM can tolerate some noise. Mixed-layout documents where column detection matters (newspapers, product catalogs). Multimodal is NOT better for: digital-native PDFs with clean text, simple tabular data where Camelot works, any document where pdfminer extracts clean structured text."],
  ["Latency and cost profile of vision calls","A 50-page PDF at 1000×1000px per page: ~50K image tokens at $3–6 for a frontier vision model call vs $0.05 for text extraction + $0.30 for text-model calls on the extracted content. Short-circuit logic: detect if a PDF has a text layer (pdfminer returns non-empty text) → use text pipeline; no text layer → route to vision. Cache document analyses aggressively: if the same document is processed repeatedly (common in enterprise), extract once, cache the structured output, skip all future vision calls for that document version."]
],
mistakes:[
  "Running vision model calls on digital-native PDFs with extractable text — 10–20× cost overhead for no quality improvement",
  "Not scoring OCR confidence and serving low-confidence extractions as ground truth",
  "Using fixed-size chunking on tables — produces cell fragments the model can't interpret",
  "Including the full database schema in NL2SQL context for a 200-table database",
  "No separate evaluation metrics for table, figure, and text modalities — end-to-end accuracy hides which component is failing",
  "No caching for processed documents in high-volume pipelines — vision calls run on every request"
],
flags:[
  "\"We use vision on all our PDFs\" — no short-circuit for digital-native documents",
  "\"OCR quality is fine\" without any measured character error rate",
  "\"We include the whole database schema\" for NL2SQL",
  "\"We can't evaluate figure understanding\" — that means the pipeline is untested on its hardest cases"
],
ask:[
  "What fraction of documents are digital-native vs scanned, and how does the pipeline route between them?",
  "What is our measured OCR character error rate on a sample of real production documents?",
  "How do we handle a document whose critical data is only in figures, not in the surrounding text?",
  "What is the end-to-end latency and cost for processing a 100-page PDF, broken down by stage?"
]
}
];
const QUIZ={
llm:[
{q:"A chatbot's monthly bill doubled while traffic stayed flat. Two weeks ago the team shipped 'more detailed answers.' Which lever do you investigate FIRST?",o:["Input token growth from longer accumulated conversation histories","Prompt cache hit-rate regression caused by the prompt change","Output tokens per response — detail means longer completions at 3–5× input price","A quiet provider price increase on the model tier in use"],a:2,exp:"All four can move a bill, but the timing points at the change: 'more detail' = longer outputs, and output is both the priciest token class and the latency driver. History growth (A) and cache regression (B) are real effects worth checking second — but they don't double a bill in two weeks the way doubled completion length does."},
{q:"With temperature=0, a team gets slightly different outputs on identical requests and files it as a provider bug. The accurate assessment?",o:["It is a bug — greedy decoding is deterministic by definition, so something is misconfigured","Expected: providers don't guarantee bitwise reproducibility (batching, hardware variance); enforce determinism at the application layer","They also need top_p=0 and a fixed seed parameter — T=0 alone only reduces randomness partially","The variance comes from prompt cache hits returning slightly stale completions"],a:1,exp:"Greedy decoding is deterministic in theory (A's logic), but real serving stacks batch requests and vary across hardware, so providers explicitly don't guarantee reproducibility. Seeds (C) help on some APIs but still carry no guarantee. If you need determinism, build it yourself: cache by input hash, canonicalize outputs."},
{q:"On your eval, a Haiku-class model scores within 1% of the flagship for a classification route. An engineer argues for the flagship anyway: 'headroom for harder future cases.' Strongest counter?",o:["Agree but negotiate a volume discount on the flagship to split the difference","Run both in production 50/50 and let live metrics decide over a quarter","Fine-tune the small model first to close the remaining 1% before deciding","Route to the small model now; add an escalation path for the hard slice when it actually appears"],a:3,exp:"'Headroom' is paying 10–12× today for cases that don't exist yet. Tier-and-escalate gets you the savings now and a designed path for hard cases later. The 50/50 test (B) burns half the savings to learn what the eval already told you; fine-tuning (C) adds work before capturing free wins."},
{q:"Your request has a 5K-token static block (system prompt + tool definitions) and ~1K of per-request data. Which layout maximizes prompt-cache savings?",o:["Static block first and byte-stable; per-request data appended last","Per-request data first so the model attends to it earliest, static block after","Interleave static and dynamic sections so partial cache segments can match","Move the static block into the first user message and keep system minimal"],a:0,exp:"Caching matches the leading prefix byte-for-byte: stable-first layouts cache the 5K block (up to 90% off); any volatile content before it — or one edited byte inside it — invalidates everything after. B optimizes for an attention concern that placement at the end already serves (recency)."},
{q:"A colleague claims 1M-token windows have made RAG obsolete: 'just send everything.' The strongest technical counter is:",o:["Models can't actually attend beyond ~200K regardless of the advertised window size","Filling 1M tokens costs $1.50–$10 per call, adds serious latency, degrades mid-window recall, and bypasses per-user access control","Long contexts will be deprecated as providers move to retrieval-native architectures","RAG is still cheaper to build and operate than long-context prompting at any scale"],a:1,exp:"B stacks the four real arguments: per-call economics, latency, lost-in-the-middle (reduced, not solved), and ACL enforcement, which requires retrieval-time filtering. A overstates (long-window recall is degraded, not zero); C is invented; D is false in general — RAG pipelines carry real engineering cost."}],
prompt:[
{q:"A teammate improved a support prompt's tone Friday; by Monday, refund-eligibility answers (same prompt) regressed 12%. The ROOT failure to fix is:",o:["No regression gate: a multi-behavior prompt changed without an eval suite covering all its behaviors","Missing version pinning allowed an older prompt variant to ship alongside the new one","Tone and policy instructions inherently conflict — they must live in separate models","The change should have gone through a human QA pass on 50 transcripts first"],a:0,exp:"The systemic fix is treating prompts as code: eval coverage spanning every behavior the prompt serves, gating every change. Manual QA (D) is a weaker, non-repeating version of the same idea. Pinning (B) addresses a different failure class. C overreacts — separation of concerns means decomposed prompts, not separate models."},
{q:"You need machine-parseable JSON from a model on every call. The production-grade approach is:",o:["Few-shot with five well-chosen JSON examples covering the edge cases","Temperature 0 plus an explicit 'respond ONLY with valid JSON' instruction","Schema-enforced structured output, so invalid JSON is unsamplable by construction","A tolerant parser with automatic repair and one retry on failure"],a:2,exp:"Constrained decoding masks invalid tokens during generation — the failure class is removed, not reduced. Few-shot (A) and instructions (B) lower the error rate; repair-and-retry (D) is a reasonable backstop but as the primary strategy it means owning a parser and a tail of weird failures forever."},
{q:"A model keeps using bullet points despite 'Do NOT use bullet points' in the system prompt. The highest-yield fix:",o:["Repeat the prohibition at both the start and end of the system prompt","Add a frequency penalty to suppress list-marker tokens during decoding","Move the rule into the user turn where it's closest to generation","Rephrase positively with a short example of the desired prose format"],a:3,exp:"Models follow 'do X, like this' far better than 'don't do Y' — prohibitions name the wrong thing without showing the right one. Repetition (A) and placement (C) buy marginal gains; decoding penalties (B) are a blunt instrument that damages legitimate text."},
{q:"You're moving a hard analytical task to a native reasoning model. Your old prompt has elaborate 'think step-by-step: first…, then…, finally…' scaffolding. You should:",o:["Keep the scaffolding — explicit structure can only help a reasoning model","Strip it: state the task and quality bar plainly; the model reasons internally and double-scaffolding can degrade output","Keep it but move it into a dedicated scratchpad field the model fills before answering","Convert the scaffold into few-shot examples of full reasoning chains"],a:1,exp:"Reasoning models internalized chain-of-thought during training; imposed scaffolds waste tokens and can fight the model's own decomposition. A and C feel safe but micromanage; D pays example-tokens on every call for reasoning the model already does. Spend the effort on task clarity and output contracts."},
{q:"Which observation most strongly indicates a prompt is doing too many jobs?",o:["It exceeds 2,000 tokens and includes both instructions and few-shot examples","It needs both a system section and per-request user content to function","Editing it for one intent keeps regressing unrelated intents that share it","It uses XML tags to delimit more than five distinct sections"],a:2,exp:"Coupling under change is the tell — same as a god-class in code. Length (A), structure (B), and sectioning (D) are all compatible with a well-scoped prompt; non-local regressions are not. The fix is decomposition: a router plus focused prompts, each separately evaluable."}],
context:[
{q:"An agent's output quality degrades noticeably around turn 40, yet the context window is only half full. Most likely cause?",o:["KV-cache eviction on the provider side for long-running sessions","Positional encoding quality degrades sharply past the model's training length","Context rot: accumulated stale tool output, dead ends, and repetition conditioning the model toward noise","The system prompt's influence decays as distance from it grows"],a:2,exp:"The window isn't full — it's polluted. Models are pattern completers, and 40 turns of unpruned tool dumps and abandoned reasoning actively condition worse output. A and B sound mechanical but don't apply at half-capacity; D has a grain of truth (recency effects) but isn't the dominant failure here. Prune and compact."},
{q:"Critical compliance rules sit at ~token 60K of a 120K prompt and get intermittently ignored. The mechanism at fault:",o:["Lost-in-the-middle: attention is strongest at the start and end of context; mid-window content gets the weakest coverage","Rules exceeded the model's instruction-following budget of a few dozen directives","The rules were in the user turn; system-role placement is required for compliance content","120K exceeds reliable attention; the call must be split into two passes"],a:0,exp:"Position, not count or role, is the failure: U-shaped attention is a well-documented empirical property. Move non-negotiables to the start, keep the live question at the end. B's 'instruction budget' isn't the binding constraint here; C matters but doesn't explain position-dependent failures; D gives up a workable window."},
{q:"Your agent occasionally needs content from a 300-page manual. The best context strategy:",o:["Embed the manual in the system prompt once and rely on prompt caching to make it cheap","Maintain a hand-built 2-page summary of the manual in every request","Give the agent search/read tools to fetch relevant sections just-in-time","Fine-tune the model on the manual so it needs no context at all"],a:2,exp:"JIT retrieval keeps the window clean and adapts to what each task needs. Caching (A) softens cost but not the accuracy hit of a stuffed window — and 'occasionally needs' means most calls pay for nothing. The summary (B) loses exactly the detail that makes a manual useful; fine-tuning (D) is slow, expensive, and bad at verbatim recall."},
{q:"A long-running agent relies on compaction summaries to carry key decisions across sessions, and decisions keep getting lost. The durable fix:",o:["Raise the compaction threshold so more raw turns survive longer","Persist critical decisions to durable artifacts (progress files, structured notes) that each session reads at boot","Run compaction more often so each summary covers less and loses less","Pin all decisions into the system prompt as they're made"],a:1,exp:"Compaction is lossy by design — tuning its frequency (A, C) just moves which information dies. The harness lesson: state that must survive lives outside the context, in files/git the next session reads. Pinning to the system prompt (D) works briefly, then becomes its own unbounded context problem."},
{q:"Why spawn a sub-agent for a broad codebase search rather than running it in the main loop?",o:["Sub-agents can use a cheaper model, cutting the cost of the search itself","Parallel sub-agents return results faster than sequential in-loop searching","Tool-output limits in the main loop truncate broad search results","A fresh-context sub-agent absorbs the noisy intermediate output and returns only the conclusion"],a:3,exp:"The point is context hygiene: broad searches dump thousands of noisy tokens that would rot the main window for the rest of the session. Cheaper models (A) and parallelism (B) are nice side benefits, not the reason; C describes a symptom you'd work around, not the design rationale."}],
landscape:[
{q:"A team argues they no longer need to benchmark new model releases because 'the frontier models are all basically the same now — 1M+ context, similar quality.' The strongest technical rebuttal:",o:["Leaderboard rankings still show 10–15 point gaps between frontier models on hard reasoning tasks","1M+ windows are commoditized but cost spreads of 70× between models filling the same window make context volume a first-class routing decision — and harness quality swamps model deltas on agentic tasks anyway","Benchmark contamination means frontier model scores are unreliable regardless of apparent similarity","Open-weight models have closed the gap enough that closed frontier model choice barely matters"],a:1,exp:"The cost-spread argument (70× from cheapest to most expensive per 1M tokens) is the practical rebuttal to 'they're all the same' — same window size does not mean same economics. And the harness-sensitivity data (same model scoring 36 points apart under different scaffolding) means that for agentic work, model choice is often the second-order variable anyway. A means baseline differences still exist. C and D are real but softer points that do not address the team's actual argument."},
{q:"Filling the same 1M-token window costs $0.14 on one frontier model and ~$10 on another. The correct architectural takeaway:",o:["Standardize on the cheapest 1M model to make long context affordable everywhere","Context volume is a first-class cost decision: tier and route by task instead of defaulting to one model","Cap all production contexts at 128K until prices converge","The premium models are mispriced and the spread will close within a quarter"],a:1,exp:"A 71× spread is a routing signal, not a verdict on any single model: cheap tiers for high-volume easy work, premium for the hard slice. Standardizing on the cheapest (A) ignores quality differences; blanket caps (C) solve cost by capping capability; price-convergence bets (D) are hope, not architecture."},
{q:"A team selected its production model because it tops a public leaderboard. The most substantive senior-level objection:",o:["Leaderboards lag actual releases by several months, so the data is stale","Arena-style rankings overweight chat style and formatting over correctness","Public benchmarks are contaminated — top models have memorized the test sets","Leaderboard deltas compress on your real traffic, and on agentic tasks harness quality swamps model deltas — validate on your own evals"],a:3,exp:"B and C name real, partial issues — style bias and contamination exist — but the decision-grade objection is D: your distribution isn't the benchmark's, the deltas shrink on the easy middle of real traffic, and the published 78/42 same-model result shows scaffolding can outweigh model choice entirely."},
{q:"What actually makes model-switching cost approach zero?",o:["Restricting usage to OpenAI-compatible API surfaces so any provider drops in","A gateway abstraction plus versioned prompts plus a standing eval suite to validate the swap","Avoiding all provider-specific features (caching, tool use, structured output) from day one","Multi-vendor contracts negotiated with capability-parity clauses"],a:1,exp:"Wire compatibility (A) gets requests flowing but says nothing about behavior — the eval suite is what tells you the swap is safe, and the gateway makes it a config change. Avoiding provider features (C) buys portability by forfeiting the platform's best capabilities; contracts (D) don't move code."},
{q:"Open-weight models (DeepSeek V4, Qwen 3.5, Llama 4) earn a place in your stack when:",o:["You need the absolute best quality on hard multi-step reasoning tasks","Sub-100ms latency requirements rule out hosted API round-trips","High-volume cost-sensitive or data-residency-bound workloads justify funding real self-hosting MLOps","Your security team prohibits sending any data to third-party APIs as a blanket policy"],a:2,exp:"The honest case is unit economics at volume and hard residency requirements — bought with real serving infrastructure and on-call. A is still the closed frontier's edge; B is solvable with hosted regional endpoints; D describes a constraint that forces the choice rather than a case where it earns it (and enterprise API tiers usually satisfy security teams)."}],
rag:[
{q:"RAG answers are mediocre and the team is on its third generation-prompt rewrite. What do you check FIRST?",o:["Run a faithfulness eval to see whether generation contradicts the retrieved context","Raise top-k so more candidate passages reach the model per query","Measure retrieval recall@k on a golden set — is the right passage even being retrieved?","Swap to the newest embedding model and rebuild the index"],a:2,exp:"Retrieval ceiling-caps the system: if the right chunk isn't in context, no prompt fixes it, and typical unmeasured pipelines miss 30–50% of the time. Faithfulness checks (A) come after you know the inputs are good; raising k (B) and re-embedding (D) are changes made blind without the recall number."},
{q:"Users searching exact part numbers ('XR-4421') get irrelevant results from a vector-only pipeline. The targeted fix:",o:["Add BM25/keyword search fused with the dense results — exact identifiers are lexical search's home turf","Increase chunk overlap so identifiers don't get split across chunk boundaries","Fine-tune the embedding model on your part-number vocabulary","Normalize identifiers into a canonical form at ingestion and query time"],a:0,exp:"Dense vectors blur exact strings by design; hybrid retrieval is the standard fix. B addresses a different failure (split chunks); C can help eventually but is weeks of work for what fusion fixes today; D helps matching consistency but doesn't make a semantic index respect exact tokens."},
{q:"A pipeline feeds raw top-10 vector hits straight into the prompt. The cheapest upgrade with the largest precision gain:",o:["Decompose queries into sub-queries and retrieve for each in parallel","HyDE-style query expansion before retrieval","Raise top-k to 30 and let the model ignore the irrelevant passages","A cross-encoder reranker over the top 50–100, keeping the best 5–10"],a:3,exp:"Reranking is the classic underused stage: one component, ~100ms, large precision win — the cross-encoder's joint attention re-scores what the coarse bi-encoder fetched. Query decomposition (A) and HyDE (B) are real but heavier techniques; raising k without reranking (C) imports noise and pays for it twice."},
{q:"Your RAG assistant answers questions about documents the asking user has no permission to open. The correct fix:",o:["Add an output filter that redacts content from restricted documents before display","Enforce document ACLs inside the retrieval query so restricted chunks never reach the context","Instruct the model to check document permissions before using any source","Maintain separate indexes per sensitivity tier and route queries by user clearance"],a:1,exp:"Authorization belongs in the retrieval layer — filter by the requesting user's permissions at query time. Output redaction (A) means the leak already happened in-context; prompt-level checks (C) make the model a security boundary, which it isn't; per-tier indexes (D) can work but is a heavyweight redesign of what a query filter solves."},
{q:"What distinguishes agentic RAG (the 2026 pattern) from a classic pipeline?",o:["Retrieved passages are verified by a judge model before entering the context","Queries are decomposed offline by a planner model into a fixed retrieval plan","Multiple specialized indexes are always queried in parallel and fused","The model treats search as a tool: deciding when and what to query, evaluating results, and iterating"],a:3,exp:"The defining shift is retrieval moving into the loop under the model's control — adaptive, multi-query, self-evaluating. A describes a guardrail you can add to either pattern; B is still a fixed pre-step (the opposite of adaptive); C describes federation, which is orthogonal."},
{q:"Your RAG pipeline shows recall@10 = 69% on a golden set but recall@50 = 94%. An engineer proposes sending all 50 chunks to the model. The correct response:",o:["Approve — 94% recall directly improves answer quality","Acceptable for short documents where 50 chunks fit comfortably","Reject: context pollution degrades generation; instead add a cross-encoder reranker to select the best 5–8 from the top 50","Approve, but add a diversity filter to de-duplicate near-identical chunks first"],a:2,exp:"recall@50 = 94% confirms the relevant chunk is in the index — the bottleneck is ranking, not coverage. Passing 50 raw chunks pollutes the context window and pays token costs for noise. A reranker extracts signal and passes only what the model needs — this is precisely the gap the reranker stage exists to fill. A and D accept the wrong fix; B trades one scaling problem for a different one."},
{q:"Users query with internal abbreviations ('OOO policy', 'PTO reqs') but your HR document corpus consistently uses expanded phrases ('out-of-office policy', 'paid time off requirements'). Results from a semantic-only pipeline are poor. The cheapest targeted fix:",o:["Fine-tune the embedding model on internal HR vocabulary","Rewrite the user query to expand abbreviations before embedding — a single cheap LLM call at query time","Add BM25 to the hybrid stack — abbreviations are lexical patterns BM25 handles natively","Maintain a separate keyword index for queries under 5 tokens"],a:1,exp:"Query expansion is the targeted fix: a cheap LLM call rewrites 'OOO policy' to 'out-of-office policy' before embedding, so the query lands in the same vector neighborhood as the corpus. BM25 (C) doesn't help here because the corpus uses the expanded form — 'OOO' and 'out-of-office' are different strings in both lexical and dense spaces; BM25 excels at exact token matches, not abbreviation-to-expansion bridging. Fine-tuning the embedder (A) teaches the model the vocabulary eventually, but it's weeks of work for a problem a one-line rewrite prompt solves today. A separate keyword index (D) has the same limitation as BM25 — the abbreviation still doesn't match the expanded term. The diagnosis here is semantic drift from vocabulary mismatch, and expansion fixes it at the source."},
{q:"An append-only RAG index has been running 18 months. When policies update, new chunks are added but old ones are never deleted. Retrieval precision dropped from 61% to 44%. The most likely cause:",o:["The embedding model's quality degrades with corpus scale","ANN index fragmentation reduces recall on older entries","Semantic dilution: updated content coexists with its stale version, splitting retrieval votes between them","Top-k was quietly reduced during a cost-cutting sprint"],a:2,exp:"Append-only indexes accumulate semantic pollution: when a policy changes, old chunks stay and new ones are added — retrieval now surfaces both versions without knowing which is current. At 18 months, version coexistence dominates the precision loss. Index maintenance — staleness pruning, version supersession, deduplication — is the structural fix. ANN tuning and model swaps can't remedy data-layer contamination."},
{q:"Your RAG chatbot answers 'What is our standard refund policy?' correctly 93% of the time but 'What is the refund policy for international orders during a promotional sale?' only 38% of the time. The most likely structural cause:",o:["The embedding model cannot reliably represent multi-concept queries","The complete answer spans multiple document sections — no single chunk contains the full intersection, so top-k retrieval returns fragments","The reranker is down-weighting chunks that mention sale-related terms","top-k is too low for compound queries in general"],a:1,exp:"Simple queries resolve against one chunk; compound queries require content spread across multiple chunks that rarely co-retrieve together in top-k. The fix is multi-query decomposition (retrieve separately for 'international refund' and 'promotional sale refund' then merge) or parent-document chunking that provides broader co-text. Neither the reranker nor top-k setting explains the specificity of this failure pattern."},
{q:"A RAG eval shows: when recall@5 succeeds (71% of queries), generation faithfulness is 84%. When retrieval fails, faithfulness drops to 28% as the model hallucinates into gaps. What is the effective faithful answer rate across ALL queries?",o:["~84% — faithfulness is measured on successful-retrieval queries","~68%","~71% — faithful rate tracks retrieval recall","~78%"],a:1,exp:"Weight by retrieval outcome: (0.71 × 0.84) + (0.29 × 0.28) = 0.60 + 0.08 ≈ 68%. Reporting faithfulness only on successful-retrieval queries (A) ignores 29% of real traffic where the model fills gaps with hallucination — the most dangerous category. Retrieval recall and generation faithfulness are compounding failure modes, which is why you must measure both components separately to diagnose the system."}],
embed:[
{q:"After a routine embedding-model upgrade, search quality quietly collapsed — no errors anywhere. The cause:",o:["The new model outputs different dimensions and the index silently truncated them","Vector normalization conventions differ between models, skewing cosine scores","Queries now embed in the new model's space while the corpus sits in the old one — cross-model similarity is meaningless","The new model requires input_type hints the pipeline isn't sending"],a:2,exp:"Two models' vector spaces have unrelated bases; comparing across them produces plausible-looking nonsense with zero errors. A would typically throw a dimension-mismatch error rather than degrade silently; B and D cause milder degradation, not collapse. Re-embed the corpus or roll back the query side."},
{q:"You must cut vector storage cost ~4× with minimal, measured quality loss. The modern first move:",o:["Deduplicate near-identical chunks before embedding to shrink the corpus","Move vectors for cold documents to keyword-only search","Re-embed everything with a smaller model that outputs fewer dimensions","Truncate Matryoshka dimensions or quantize, validating recall at each step"],a:3,exp:"Matryoshka truncation and quantization are designed for exactly this — graceful, measurable degradation without re-embedding or model risk. Dedup (A) helps but rarely 4×; tiering to keyword (B) changes retrieval behavior for those docs; a smaller model (C) is a full migration with unknown quality, not a tuning knob."},
{q:"Legal-domain retrieval underperforms despite using a top-5 MTEB embedding model. The highest-leverage fix:",o:["Chunk by legal document structure (sections, clauses) instead of generic boundaries","Fine-tune the embedding model on a few thousand in-domain query–passage pairs","Add a legal-domain reranker to compensate for first-stage retrieval misses","Expand queries with legal synonyms and citations at retrieval time"],a:1,exp:"All four are real techniques — that's the trap. But MTEB rank ≠ jargon-heavy domain performance, and embedding fine-tuning attacks the root cause (the model's representation of legal language) for the largest recall gains. Structural chunking (A), reranking (C), and expansion (D) layer well on top, but they compensate rather than fix."},
{q:"Why do input_type hints (query vs document) measurably improve retrieval?",o:["They route queries to a faster, smaller encoder tuned for short text","They normalize text length before pooling so short queries aren't penalized","Queries and documents are asymmetric text types; hinted models encode each appropriately","They enable compatibility between vectors produced by different model versions"],a:2,exp:"A five-word question and a 500-word passage are different distributions; models trained with the distinction encode them into better-aligned spaces. A and B invent mechanisms; D is false — nothing bridges cross-model spaces."},
{q:"Beyond retrieval, which is a production-proven embedding application?",o:["Lossless compression of long contexts before sending them to the model","Semantic caching: recognizing a new request as a paraphrase of an answered one and skipping the LLM call","Replacing cross-encoder rerankers at equivalent precision for lower cost","Encrypting documents in a way that preserves searchability"],a:1,exp:"Semantic cache is a workhorse cost lever on repetitive traffic. A is impossible (embeddings are lossy by definition); C inverts the architecture — bi-encoders are the coarse stage, cross-encoders the precise one; D describes searchable encryption, a different field entirely."}],
vecdb:[
{q:"A startup with 300K vectors already runs Postgres. The team wants a dedicated managed vector DB 'for growth headroom.' Your call:",o:["Approve — migrating later at 10M vectors will be far more painful than starting right","OpenSearch, since their logs already live there and it does vector search now","pgvector with HNSW — at this scale it removes a system while keeping joins, transactions, and ACLs","Embedded FAISS in the app with nightly snapshots for simplicity"],a:2,exp:"Below ~5–10M vectors, the bolt-on wins on operational simplicity, and 'growth headroom' is speculative complexity — migration later is a real but bounded cost, paid only if growth materializes. OpenSearch (B) is plausible if it's already core infra, but adds an index tier they don't need; FAISS (D) trades durability and ops maturity for less than pgvector offers."},
{q:"ANN search with a selective tenant filter sometimes returns zero results although matches exist. The classic cause:",o:["ef_search is too low relative to the filter's selectivity — raise it until results appear","The engine post-filters: it fetches top-k first, then applies the filter, which can eliminate all k","Tombstoned (deleted) vectors are being excluded, shrinking the candidate set","The metadata index has drifted out of sync with the vector segments"],a:1,exp:"Post-filtering is the textbook failure: selective filters annihilate an unfiltered top-k. A is the seductive wrong answer — raising ef_search papers over the architecture problem expensively and incompletely; the fix is pre-filter/filtered-ANN semantics. C and D are real operational issues with different signatures (gradual, not filter-correlated)."},
{q:"Nobody has ever measured the ANN index's recall against exact search. The risk you're carrying:",o:["Minimal — modern HNSW defaults hold >99% recall across workloads","Recall only becomes a concern above ~100M vectors where graphs fragment","Silent relevance loss: speed-tuned parameters can quietly cap recall at 70–80%, bounding the whole RAG stack","None that matters — the reranker downstream recovers anything the index misses"],a:2,exp:"ANN trades recall for speed by design, and tuning drift is silent — no errors, just worse answers. A's '>99% always' is exactly the assumption that bites; D misunderstands the pipeline: a reranker can only re-order what retrieval surfaced. Measure against brute force on a sample, monthly."},
{q:"Why should the vector index NOT serve as your source of truth?",o:["Vector databases universally lack ACID guarantees, making them unsafe for records","Embeddings cannot be inverted back to text, so the data is unrecoverable","Retention costs grow quadratically with corpus size in graph indexes","It's a rebuildable derivative: embeddings change with model versions and ANN structures need rebuilds — truth belongs upstream"],a:3,exp:"The index is disposable infrastructure with a rebuild path from a durable store — that's the architecture, regardless of any engine's ACID story (A is an overgeneralization; some offer strong guarantees). B is true but irrelevant if you store source text; C is invented."},
{q:"A tenant reports seeing another tenant's content in vector search results. The most likely design flaw:",o:["Isolation relied on a soft metadata filter (or prompt instruction) instead of enforced namespaces/partitions at the index layer","Embedding collisions — semantically similar content across tenants mapping to near-identical vectors","A shared semantic cache returning another tenant's cached answers","HNSW graph edges crossing tenant boundaries during traversal"],a:0,exp:"Filters-by-convention fail exactly once and it's an incident; isolation must be enforced where the query executes. B describes normal embedding behavior, not leakage; C is a real adjacent risk but the report says search results; D anthropomorphizes the graph — traversal respects whatever isolation you actually enforced, which is the point."}],
memory:[
{q:"'Our agent's memory is the last 50 messages.' The senior critique:",o:["Fifty messages is too few — successful personalization needs at least a few hundred turns","That's working history, not memory: nothing is extracted, persisted, or selectively retrieved across sessions","Raw messages should be summarized before storage to cut token costs","The buffer should be token-bounded rather than message-bounded for predictability"],a:1,exp:"A buffer evaporates when the session ends and bloats context while it lives. Memory means extracted durable facts with provenance, retrieved selectively. A, C, and D all accept the buffer-as-memory premise and tune it — the premise is the error."},
{q:"A user corrected their dietary preference months ago; the assistant still serves the old one. Both facts are in the memory store. The ROOT design flaw:",o:["Retrieval ranks the older memory higher — recency boosting at read time would fix it","The extraction step missed the correction's significance — a better extractor model is needed","Append-only memory: contradictions must supersede prior facts at write time, not coexist","Preference-class memories lack TTLs, letting stale facts persist indefinitely"],a:2,exp:"A and D are patches that leave the contradiction in the store — read-time recency (A) is fragile and TTLs (D) expire true facts too. The principled fix is at write: detect contradiction, supersede with history preserved. C (better extractor) misdiagnoses — the correction WAS captured; both facts exist."},
{q:"Why did file-based memory (progress files, MEMORY.md) win for long-running agents in 2026 harnesses?",o:["Files avoid the embedding and vector-store costs of semantic memory","Filesystem access is faster than database reads inside agent sandboxes","Git history makes a separate provenance system unnecessary","Artifacts are durable, inspectable, survive compaction and crashes, and any session or harness can read them"],a:3,exp:"The killer property is bridging amnesia: durable, human-auditable state that the next context window boots from. Cost (A) and speed (B) are incidental; git-as-provenance (C) is a genuine bonus but a side effect of the design, not the reason for it."},
{q:"The agent's memory contains 'user authorized purchases up to $500' — extracted from a session where the user READ A PHISHING EMAIL ALOUD to ask if it was a scam. Weeks later the agent auto-approves a purchase. The core failure:",o:["The extraction model was too small to grasp conversational nuance — upgrade it","Authorization-class memories should require exact-phrase matching at retrieval time","Memory poisoning: no provenance/speech-act check at write (quoted ≠ asserted), and memory content was trusted as instruction at read","The purchase tool lacked a per-transaction amount limit"],a:2,exp:"Two layers failed: the write path stored reported speech as a user assertion, and the read path let memory function as a privileged instruction. D (amount limits) and approval gates are necessary defense-in-depth but don't fix the poisoned store; A misses that this is an architecture gap, not a model-size gap."},
{q:"Which design choice is simultaneously a trust feature AND a correctness feature for user-facing memory?",o:["A cryptographic audit log proving no memory was tampered with","User-visible, editable memory — users correct wrong facts, and transparency builds calibrated trust","Automatic expiry of all memories after 30 days to bound staleness","Admin-only memory editing to guarantee data integrity"],a:1,exp:"Visibility gives you free error correction (correctness) and consent (trust) in one feature. Audit logs (A) prove integrity of possibly-wrong data; blanket expiry (C) deletes true facts on schedule; admin-only editing (D) optimizes integrity while blocking the person who actually knows the truth."}],
agents:[
{q:"A process has 6 well-defined steps that never vary. The team built an autonomous agent for it. Your assessment:",o:["Acceptable if the loop has solid iteration caps and budget bounds","Make it a workflow: enumerable paths get predictable, debuggable, cheap orchestration — agents are for paths you can't enumerate","Reasonable — agents future-proof the design for when steps DO start varying","Keep the agent but constrain it with plan-then-execute so it follows the 6 steps"],a:1,exp:"Runtime path-choosing is pure cost when the path is known: new failure modes, harder debugging, more tokens — for zero flexibility benefit. A bounds the waste without removing it; C pays today for hypothetical variance; D re-implements a workflow inside an agent, the worst of both."},
{q:"An agent with 95% per-step reliability runs a 20-step task. Expected end-to-end success, roughly:",o:["~80% — most step failures are locally recoverable and don't sink the task","~36% — per-step error compounds multiplicatively (0.95^20)","~60% — compounding applies but verification absorbs about half the failures","~95% — reliability is per-step and the figure carries end-to-end"],a:1,exp:"0.95^20 ≈ 0.36. The distractors describe what people WISH were true: recovery (A) and absorption (C) only exist if you build verification gates — which is precisely why the math makes gates, fewer steps, and sharper tools the three levers that matter."},
{q:"Your agent periodically declares a half-finished task complete. The most effective fix:",o:["A second agent reviews and approves the first agent's completion claims","Strengthen the prompt: 'be exhaustive; never stop before everything is done'","A harness-verified completion contract — tests or a structured checklist that code, not the model, validates","Lower the temperature so the agent behaves more conservatively"],a:2,exp:"Premature victory needs external ground truth. A reviewer agent (A) is the tempting one — but it swaps one model's self-report for another model's opinion, still ungrounded; useful as a layer, not as the foundation. Prompt exhortations (B) and temperature (D) don't create verification."},
{q:"Which action class should ALWAYS carry a human approval gate in a production agent?",o:["Any tool call that makes an external network request","Operations touching any customer personal data","Irreversible or destructive operations: sends, deletes, payments, production deploys","All state mutations, regardless of reversibility"],a:2,exp:"The gate criterion is irreversibility — one-way doors get humans. B is the tempting over-trigger: plenty of PII-touching reads are routine and gating them all kills the agent's usefulness (access control belongs at the tool layer). A and D gate by mechanism rather than consequence."},
{q:"The fastest path to improving a struggling production agent is usually:",o:["Swap in the newest flagship model and re-run the suite","Add a critic agent that reviews each step before execution","Double the iteration budget so the agent can recover from missteps","Sharpen the tools: clearer descriptions, instructive errors, narrower scopes, and a pruned tool list"],a:3,exp:"Most 'agent stupidity' is tool-design debt — the model reads your descriptions every call and debugs from your error messages. Model swaps (A) ride someone else's roadmap; critics (B) add cost and latency atop the unfixed root cause; bigger budgets (C) fund more flailing."},
{q:"Your agent averages 18 steps per task at $0.02/step, running 20,000 tasks/month. A harness refactor costs $15,000 in engineering time and would cut average steps to 11. Payback period:",o:["~1.9 months","~3.2 months","~5.4 months","Never — at this step count, a better model is a higher-leverage investment"],a:2,exp:"Baseline: 20,000 × 18 × $0.02 = $7,200/month. After refactor: 20,000 × 11 × $0.02 = $4,400/month. Monthly savings: $2,800. Payback: $15,000 ÷ $2,800 ≈ 5.4 months. A (~1.9 months) divides the refactor cost by baseline spend ($7,200) instead of savings ($2,800) — it counts all spend as savings, which it isn't. B (~3.2 months) divides by post-refactor spend ($4,400) instead of savings — same error in the other direction. D is wrong on the logic: a better model doesn't change step count, which is what drives cost here. Harness investment reduces steps; model upgrades improve per-step quality. They're different levers."},
{q:"An agent tasked with researching 7 competitors spends 47 tool calls covering only 2 of them before hitting the iteration cap. The ARCHITECTURAL fix:",o:["Double the iteration cap so all 7 competitors get coverage","Add a critic agent that monitors coverage and redirects after each competitor","Decompose: a planner emits 7 sub-tasks; a worker agent handles each competitor with its own tool-call budget","Increase context to fit all research in one pass"],a:2,exp:"Without per-unit allocation, the agent spends its full budget however it wants — and fixating on two competitors is rational local behavior with no global constraint. Decomposition makes coverage an architectural guarantee: the orchestrator can't succeed unless all 7 workers return results. Doubling the cap (A) gives the agent more money to spend unevenly; the critic (B) detects the problem late without structurally preventing it."},
{q:"Production agent logs show it sometimes calls cancel_order() before verify_payment_received(), causing incorrect cancellations. The system prompt already says 'always verify payment before cancelling.' The correct fix:",o:["Strengthen the prompt with an explicit example of the correct sequence","Enforce tool availability at the harness level — cancel_order is only exposed after verify_payment_received returns success","Add a human approval gate on cancel_order","Switch to a reasoning model that plans all tool calls upfront"],a:1,exp:"Prompt instructions compete with task pressure and fail exactly in the high-stakes cases where they matter most. Making the wrong call sequence architecturally impossible — by gating cancel_order behind a successful payment verification result — removes the failure class entirely. Human gates (C) are good defense-in-depth but the agent can still call them in the wrong order. Architectural constraints beat behavioral instructions for safety-critical sequences."},
{q:"A multi-session coding agent restarts from scratch each session, ignoring progress from prior sessions. Root cause and fix:",o:["Context window is too short — increase max tokens so sessions run longer","No durable state: write a structured progress artifact (files changed, approach taken, remaining work) at session end; read it at session start","Compaction is deleting progress — raise the compaction threshold","The agent needs an embedding store that persists semantic memory of prior sessions"],a:1,exp:"Each new session is amnesiac by design — the prior transcript is gone. Durable files are the proven fix: structured state the next session reads at boot, independent of context length or compaction settings. Longer sessions (A) delay the problem. Embedding stores (D) retrieve semantic content but can't restore structured progress state or track which commits were made as reliably as a file the agent wrote and can directly read."},
{q:"An agent generates 2,100 tokens of verbose reasoning narration per action turn but only 180 tokens constitute the actual action output. At 10,000 tasks/month with 6 action turns each, and output priced at $15/M tokens, what is the monthly overhead cost of the narration?",o:["~$990/month","~$1,350/month","~$1,725/month","~$3,780/month"],a:2,exp:"Narration overhead per turn: 2,100 − 180 = 1,920 tokens. Total per month: 10,000 × 6 × 1,920 = 115.2M tokens. Cost: 115.2 × $15 = $1,728/month — closest to C (~$1,725). A uses wrong overhead (applies full 2,100 tokens as cost rather than just the 1,920-token overhead delta); B divides by a different denominator; D double-counts by applying per-turn cost to all turns rather than just overhead tokens. The fix — a structured action schema or a scratchpad field excluded from the response — eliminates this overhead entirely."}],
tools:[
{q:"The model keeps calling search_orders when search_invoices is correct. Fix FIRST:",o:["Rewrite both descriptions with explicit use-when / don't-use-when guidance and examples","Add an intent classifier that forces tool_choice before the model sees the request","Merge them into one search tool with a 'type' parameter the model sets","Collect selection traces and fine-tune the model on correct tool choices"],a:0,exp:"Descriptions are the model's only documentation, re-read every call — ambiguity there is the usual culprit and the five-minute fix. Forced routing (B) is legitimate but adds a component to compensate for fixable docs; merging (C) trades a selection error for a parameter error; fine-tuning (D) is weeks of work for a documentation bug."},
{q:"A tool returns 'Error 400' on bad input and the agent flails. The better design:",o:["Retry server-side with backoff before surfacing anything to the model","Return instructive errors — 'date must be YYYY-MM-DD, got 6/10/26' — so the model can self-correct","Return an empty result set so the loop continues gracefully past the failure","Halt the loop on tool errors and escalate to a human immediately"],a:1,exp:"Error text re-enters context as the model's debugging information — write it like coaching. Silent retries (A) help for transient faults but a malformed date will fail forever; empty results (C) teach the model that the data doesn't exist, which is worse than an error; halting (D) turns every recoverable mistake into an escalation."},
{q:"A tool accepts user_id as a model-supplied parameter for fetching private data. Verdict:",o:["Acceptable when the tool is read-only and responses are logged","Acceptable if the server validates that the user_id exists and is well-formed","Privilege escalation by design: identity must come from server-side session context, never from model-generated arguments","Acceptable at temperature 0 where the model won't improvise IDs"],a:2,exp:"B is the trap — format validation confirms the ID is real, not that the model may act for it. The model is not a principal: anything it generates is untrusted, including identities, and injection can steer it. Read-only (A) softens impact, not the violation; temperature (D) is irrelevant to trust boundaries."},
{q:"The problem MCP (Model Context Protocol) actually solves:",o:["A standard authentication and authorization layer for AI tool access","Tool integrations written once, usable by any compliant model or harness — ending per-app bespoke integrations","Versioned schema negotiation between different model providers","Faster structured-output decoding through pre-registered schemas"],a:1,exp:"MCP is the interop standard — the USB-C move: servers expose tools/resources once; Claude, IDEs, and other harnesses all consume them. Auth (A) and schema mechanics (C, D) are details within or adjacent to the protocol, not the problem it exists to solve."},
{q:"Answering one query requires three independent lookups; the agent runs them one per turn. The improvement:",o:["Cache all three results so subsequent queries skip the lookups entirely","Merge the three into one composite tool to guarantee a single round trip","Acceptable as-is — serial execution preserves ordering and simplifies tracing","Emit them as parallel tool calls in a single turn — independent calls batch, cutting latency ~3×"],a:3,exp:"Modern models batch independent calls natively; serial-only loops are a silent latency tax. Caching (A) helps repeat traffic, not the first user; a composite tool (B) couples unrelated operations and bloats its own contract; 'ordering' (C) is exactly what independence means you don't need."}],
harness:[
{q:"CORE-Bench evaluations showed Opus 4.7 scoring 78% in Claude Code's harness and 42% in a weaker one — a 36-point gap from the same model. The defensible conclusion:",o:["The benchmark is flawed — results that unstable shouldn't inform decisions","Multi-step capability is a model+harness property; scaffolding quality can outweigh model choice","The weaker harness was misconfigured; properly set up, the gap would mostly close","Benchmarks should mandate a reference harness so models are comparable in isolation"],a:1,exp:"Same model, 36-point spread — the scaffolding (context management, verification, recovery) IS capability on agentic work. C assumes away the finding (the 'misconfiguration' is the harness quality difference); D is a reasonable methodology wish that dodges the engineering lesson; A shoots the messenger."},
{q:"In the harness-as-operating-system analogy, context curation corresponds to:",o:["The boot sequence — initializing the system prompt and hooks at session start","Device drivers — the standardized interfaces to tools and skills","RAM management — deciding what's loaded in the window, what's paged out via compaction, what's fetched on demand","The scheduler — allocating work across the loop and sub-agents"],a:2,exp:"All four mappings are real parts of the analogy — that's the point of it. Context curation specifically is memory management: loading, eviction (compaction), and demand paging (JIT retrieval). Boot = prompt/hooks setup; drivers = tool interfaces; scheduler = loop/sub-agent orchestration."},
{q:"A long-running coding agent keeps 'one-shotting' — attempting the whole app, dying mid-context with undocumented state. Anthropic's proven fix:",o:["A planning phase that outlines all features before any code is written","Automatic checkpointing of the full conversation every N tool calls","An initializer agent that builds the environment (init script, JSON feature checklist, initial commit), then sessions that each complete ONE verified feature and update durable progress artifacts","A larger context window so complete implementations fit within one session"],a:2,exp:"The published pattern pairs environment setup with incremental, verified, artifact-logged progress — each amnesiac session boots from durable state. Planning alone (A) still one-shots the execution; transcript checkpoints (B) preserve the mess rather than structure the work; bigger windows (D) delay the wall and worsen the crash."},
{q:"Why did Anthropic use JSON for the agent's feature checklist — with instructions to only flip a 'passes' field — instead of Markdown?",o:["JSON parses reliably, letting the harness render progress dashboards from the file","Models are less likely to inappropriately rewrite structured JSON, and constrained edits stop the agent deleting requirements to 'pass'","JSON tokenizes more compactly than Markdown, saving context on every read","Git diffs on JSON are line-stable, making session-over-session review easier"],a:1,exp:"It's a guardrail against the agent gaming its own success criteria: models treat structured JSON as less editable than prose, and the flip-one-field rule constrains the temptation. A, C, and D are all true-sounding engineering perks — none is the published reason."},
{q:"Each new session of a multi-window agent should BEGIN by:",o:["Resuming precisely where the previous transcript ended to preserve momentum","Running the full test suite before reading any project state","Asking the orchestrator or user for a fresh brief to avoid stale assumptions","Orienting: read progress notes and git log, run the init check, verify basic state — then select ONE work item"],a:3,exp:"Boot-sequence discipline catches yesterday's undocumented breakage before building on it. 'Resuming' (A) assumes a transcript the amnesiac session doesn't meaningfully have; full test suites (B) cost time the targeted boot-check covers; asking for a brief (C) discards the durable state that exists precisely to answer that question."},
{q:"Your team proposes hand-rolling the agent loop 'in a sprint — it's just a while loop.' The experienced counter:",o:["Custom loops can't access provider features like parallel tool calls and caching","The loop is the easy 10%; proven harnesses embody years of compaction, permissions, resume, and verification engineering you'd rebuild badly under deadline","In-house loops create unbounded liability that legal will eventually block","Provider SDKs are contractually required for production tool use"],a:1,exp:"It IS just a while loop — for the demo. Production is the forty failure modes around it: context exhaustion, premature victory, crash recovery, permission gates. A, C, and D are false as stated; the real argument is engineering economics, same as not hand-rolling a web framework."},
{q:"A junior engineer asks why Claude Code keeps a MEMORY.md index file separate from CLAUDE.md instead of putting all memory in one file. The accurate explanation:",o:["MEMORY.md is always loaded into context; CLAUDE.md is loaded only when explicitly requested","MEMORY.md is a lightweight index so the model can triage relevance before loading full memory files; CLAUDE.md contains structural project facts relevant to every session — they serve different recall patterns","CLAUDE.md cannot exceed 500 lines before it degrades context performance","MEMORY.md is stored in the cloud while CLAUDE.md is a local-only file"],a:1,exp:"The separation is a context management decision: CLAUDE.md contains facts always relevant to every session (project structure, commands, conventions). MEMORY.md is an index of selectively-loaded memories — reading its one-line descriptions lets the model decide what's relevant without loading full files into every context. This is JIT retrieval applied to agent memory."},
{q:"An agent session fails at step 23 of a 30-step plan with a tool error. The next session reads the progress artifact and resumes at step 24 — but reintroduces a bug fixed in step 17. What progress artifact design flaw caused this?",o:["The artifact tracked completed steps but not the decisions, constraints, and rationale that informed each step","The session failed to write the progress artifact before crashing","Step 24 should automatically re-run steps 17–23 as a verification pass","The artifact should be stored in git rather than a flat file"],a:0,exp:"A checklist of completed steps ≠ the context of how they were completed. Step 17 fixed a bug — the fix was a decision the next session needed to inherit, but only the 'completed' flag was recorded. A robust progress artifact captures key discoveries, architectural decisions, and non-obvious constraints, not just done/not-done flags. The session at step 24 had no way to know about the step-17 constraint."},
{q:"Your harness compacts context when it reaches 80% of the 200K window. Post-compaction resets the window to 8K tokens. Each work unit generates approximately 3,000 tokens. How many work units complete between the first and second compaction events?",o:["~37 units","~50 units","~51 units","~64 units"],a:1,exp:"After first compaction: 8K tokens. Second compaction fires at 160K (80% of 200K). Available growth: 160K − 8K = 152K. Units until compaction: 152K / 3K ≈ 50.7 → ~50 units. C (~51) results from using 5K (initial system prompt size) instead of 8K (post-compaction reset size) as the start point. Understanding this math lets you right-size work units so task boundaries align naturally with compaction events."},
{q:"A developer wants to use 'Bypass Permissions' mode during interactive development to reduce approval prompts on a large refactor. The correct guidance:",o:["Yes — if the prompts were verified in a prior session, re-prompting adds no safety value","Yes for internal tooling that doesn't touch user-facing code","Almost never during interactive work — approval prompts keep a human in the loop on unexpected tool calls; automate only in tested, scoped CI pipelines with pre-verified permissions","Yes if a peer-reviewer will audit the changes afterward"],a:2,exp:"Bypass mode is designed for automated non-interactive pipelines where the full action scope is pre-verified and no human can respond to prompts anyway. During interactive work, prompts surface unexpected behavior — the moment human oversight matters most. A large refactor touching many files is exactly when you want prompts, not when you skip them. Peer review (D) catches mistakes after the fact; prompts surface them before."},
{q:"CORE-Bench evaluations show 78% task success with Claude Code's harness and 42% with a weaker harness for the same model — 36 points from the same model. Your team's agent currently scores 59% with your harness. What range is realistic from harness engineering alone?",o:["Diminishing returns apply above 50% — harness gains matter most below that threshold","36 points is the theoretical maximum; expect 10–15 points in practice","Potentially 75–90% — the benchmark shows harness quality can match or exceed model choice as the binding constraint; context management, verification gates, and progress artifacts are the levers","At most 5–10 points — the 36-point delta was specific to Claude Code's proprietary infrastructure"],a:2,exp:"The benchmark is not a ceiling — it proves harness engineering moves the same model 36+ points, and your 59% baseline is below the upper bound (78%). The levers are compaction quality (preventing context rot at turn 23), verification gates (preventing premature victory), and durable progress artifacts (preventing multi-session amnesia). C is the honest answer: harness quality is often the binding constraint, not model capability, which is why scaffolding quality swamps model deltas on agentic work."}],
multi:[
{q:"The strongest justification for adding a second agent to a system is:",o:["Model diversity — different models cross-check each other's errors","A subtask needs context isolation or true parallelism that one window can't provide","Specialized role prompts outperform one generalist prompt on every subtask","Cost attribution — separate agents make per-workstream billing clean"],a:1,exp:"Isolation and parallelism are the honest reasons — they map to real architectural constraints. Model-diversity ensembling (A) sounds rigorous but rarely survives cost-benefit for generation; C is true only when 'roles' reflect genuinely different tools/contexts, which is just isolation again; D is solvable with tags."},
{q:"In an orchestrator–worker system, results return inconsistent and overlapping. The most likely bottleneck:",o:["Workers lack shared memory and can't see each other's progress","Worker contexts are too small for their assigned subtasks","Brief quality — vague orchestrator task descriptions cause drift and duplication, like vague human delegation","Workers run different model versions with different behaviors"],a:2,exp:"Agents communicate through text; the brief (objective, boundaries, output contract) is the load-bearing wall. Shared memory (A) is the seductive fix that adds coupling to compensate for unclear scope — fix the briefs first. B and D are checkable but rarely cause this signature."},
{q:"What should a research sub-agent return to its orchestrator?",o:["Its full transcript, so the orchestrator can audit the reasoning","A tight conclusion with citations — the noise quarantine was the point of spawning it","All raw source material found, letting the orchestrator judge relevance itself","Its complete reasoning chain plus confidence scores per claim"],a:1,exp:"Returning transcripts (A) or raw material (C) re-imports the pollution the sub-agent existed to absorb — audit trails belong in observability, not in the orchestrator's context. Reasoning chains with confidence (D) sounds rigorous but is noise with numbers attached. Conclusions, scoped and sourced."},
{q:"A five-agent pipeline costs 12× the single-agent baseline and scores marginally better. The verdict:",o:["Ship it — in production, marginal quality compounds across thousands of runs","Optimize the pipeline: cache inter-agent messages and batch the workers before judging","Coordination tax unjustified: multi-agent burns 4–15× tokens and needs proportional value — simplify","Run both in production and let user feedback arbitrate over a quarter"],a:2,exp:"Marginal gains at order-of-magnitude cost lose to investing the same money in a better single-agent harness. A's 'quality compounds' cuts both ways — so does cost; B optimizes a structure that hasn't justified existing; D spends a quarter and real traffic learning what the eval already showed."},
{q:"Two agents working concurrently keep overwriting each other's edits to a shared document. The fix:",o:["Merge both agents into one context so conflicts are impossible","Add retry-with-backoff so failed writes eventually land","Have each agent re-read the document immediately before every write","Ownership rules: partitioned artifacts, explicit section owners, or sequential merge points"],a:3,exp:"Shared mutable state needs the same discipline as concurrent code — ownership, partitioning, or serialization. Read-before-write (C) narrows the race window without closing it; retries (B) make last-write-wins more reliable at losing work; merging agents (A) may be right but forfeits the parallelism that motivated the split."}],
design:[
{q:"Nine services call the provider SDK directly; a 3-hour provider outage just took your product down. The STRUCTURAL fix:",o:["Standardize retry-with-exponential-backoff policies across all nine services","Subscribe to the provider status page and feature-flag AI off automatically during incidents","An LLM gateway: one choke point providing routing, fallback chains, caching, and cost attribution","Deploy your application across multiple regions for resilience"],a:2,exp:"Retries (A) extend an outage's pain; auto-disable (B) is graceful surrender, useful as a last layer; multi-region (D) doesn't help when the dependency itself is down. The gateway is the enabling structure — cross-provider fallback, caching that survives outages, and future model swaps as config."},
{q:"A nightly job classifies 2M records with synchronous flagship calls. The two changes that stack to ~75% savings:",o:["Prompt compression plus doubled request concurrency","Batch API (~50% off async work) plus a right-sized smaller model for classification","Semantic caching plus off-peak scheduling for lower latency variance","Response streaming plus aggressive max_tokens caps"],a:1,exp:"Batch-shaped work should never pay synchronous prices, and classification rarely needs flagship quality — the two discounts multiply. Compression (A) and token caps (D) trim percentages; semantic cache (C) needs duplicate-heavy traffic, and 'off-peak' doesn't change API pricing."},
{q:"Where do guardrails belong in the request path?",o:["Output-side primarily — that's what users actually see","Input-side primarily — prevention beats detection","In the system prompt, as explicit policies the model enforces","Both sides: input rails (injection, PII, topic) before the model; output rails (schema, faithfulness, safety) after"],a:3,exp:"Each side catches what the other can't: input rails stop injection and PII ingress; output rails catch hallucination and schema breaks. The system prompt (C) is the weakest enforcement point — it's a request to the model, not a control on it."},
{q:"Production behavior shifted Tuesday; nobody changed anything. Investigation: the model alias auto-upgraded under you. The prevention:",o:["Pin explicit model versions and treat upgrades as deliberate, eval-gated releases","Run a continuous 1% canary against the alias to detect behavior shifts early","Subscribe to provider changelogs and freeze deploys around announced updates","Lock SDK and API versions in CI so upgrades can't ride in silently"],a:0,exp:"Canaries (B) detect drift; pinning prevents it — detection is the consolation prize. Changelog vigilance (C) is hope as process; SDK pinning (D) misses that the change rode the model alias, not the client library. Pin everything that affects behavior; version it together."},
{q:"Which observability setup catches AI quality regressions BEFORE users report them?",o:["Infra dashboards (latency, error rates, token throughput) with tight SLO alerts","Weekly human review of a random transcript sample by the product team","Full traces plus asynchronous judge-scoring on sampled production traffic, with drift alerts on the score series","Thumbs-down rate monitoring with anomaly detection"],a:2,exp:"Quality needs quality instruments: sampled online evals see what infra metrics (A) are blind to. Human review (B) works at toy scale with week-long latency; user feedback (D) is sparse, biased, and arrives after the damage — it's the lagging indicator you're trying to beat."},
{q:"You need to route requests to three LLMs based on task complexity. A junior engineer proposes hardcoded routing rules in a config file. A senior engineer wants an ML intent classifier. What's the right call for v1?",o:["ML classifier — classification is exactly what ML does best and should be built upfront","Hardcoded rules in a config file — fast to ship, readable, adjustable without retraining; add the classifier when rules get unwieldy or ambiguous","LLM-based router — use the model itself to judge its own task complexity","A/B test both for two weeks before committing to either approach"],a:1,exp:"Rules-first is the correct default: 5 IF statements in a config file ship in a day and are inspectable, debuggable, and editable without a training pipeline. The ML classifier adds labeled data, a training loop, a deployment pipeline, and a second model to debug — pay those costs when the rules actually break down. C puts the slowest, most expensive component on the hot path for a routing decision. A conflates 'ML can do this' with 'ML should do this first.'"},
{q:"Your LLM feature has p99 latency of 4.3s but median of 820ms. Users complain about slow responses. What does this distribution tell you, and what do you investigate first?",o:["The model is slow across the board — right-size max_tokens globally","High p99 with low median means long-tail outliers, not uniform slowness — investigate output token length profiles, which prompts or user patterns generate very long completions, and whether streaming is adopted","4.3s p99 is within normal range for frontier LLM APIs; set user expectations","The problem is network latency to the provider — move to a geographically closer region"],a:1,exp:"A 5× gap between p99 and median is the signature of distribution skew, not uniform latency. In LLM systems, long-tail latency almost always tracks output token length: a small fraction of queries generate 10× the tokens and dominate the p99. Investigate with a histogram of output token counts bucketed by latency percentile before making any system changes. Network (C) and region (D) are flat additions to latency, not multipliers that would create this spread."},
{q:"Your startup's monthly LLM invoice hits $51,000 against a $24,000 projection. No alerts fired. Which gateway capability would have caught this before month-end:",o:["A fallback chain that routes to cheaper models when the primary is under load","Response streaming to reduce perceived latency and token waste","Per-endpoint cost attribution with real-time spend alerts at configurable thresholds","Prompt compression middleware to reduce input tokens"],a:2,exp:"Cost observability is the missing capability — without it, overruns are invisible until the invoice arrives. Per-endpoint attribution would show which feature or team triggered the spike within hours; threshold alerts would surface it within dollars, not tens of thousands. B, C, and D reduce spend but don't prevent invisible overruns. A gateway without spend visibility is a single point of ignorance."},
{q:"Your API adds a synchronous LLM call that takes 1.1s at p50. Your service's total p50 latency budget is 2s. Users who exceed 2s total latency churn at 3× the base rate. Which design most directly removes the LLM latency from the critical path?",o:["Cache the 15% of queries that repeat exactly — reduces LLM calls for those users","Move the LLM call off the synchronous path: return a provisional response immediately and deliver the AI enrichment asynchronously","Switch to a 35% faster model (target: ~715ms p50)","Cap max_tokens tightly to reduce generation time"],a:1,exp:"Async delivery removes the LLM latency from the user-perceived response time entirely — the user sees a response at normal speed; the AI result arrives as a follow-up. Caching (A) helps the 15% but does nothing for the 85%; a faster model (C) cuts 1.1s by 35% to ~715ms, which still consumes 36% of the total 2s budget; max_tokens (D) depends on whether output length is currently the bottleneck."},
