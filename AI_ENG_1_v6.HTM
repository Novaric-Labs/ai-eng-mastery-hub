harness:{intro:"The initializer/session pattern from Anthropic's long-running-agent work, as runnable structure: durable artifacts bridge the amnesia between context windows.",
code:`INITIALIZER_PROMPT = """Set up this project for incremental multi-session work:
1. Write init.sh that starts the dev environment and a basic health check.
2. Expand the spec into features.json: every feature as
   {"id", "description", "verify_steps", "passes": false}.
   It is unacceptable to remove or edit features later - only flip "passes"
   after verifying end-to-end.
3. Write PROGRESS.md (what exists, what's next). Make the initial commit."""

SESSION_PROMPT = """You are continuing long-running work. Boot sequence - do
these IN ORDER before any new work:
1. pwd; cat PROGRESS.md; git log --oneline -15   (orient)
2. bash init.sh                                   (verify environment)
3. Run the basic health check; if ANYTHING is broken, fix it FIRST.
4. Read features.json; choose the single highest-priority failing feature.
5. Implement it. Verify end-to-end as a user would (not just unit tests).
6. Only then set its "passes": true. Commit with a descriptive message.
7. Update PROGRESS.md: what you did, what's next, anything surprising.
Work on exactly ONE feature this session."""

# Harness hooks - enforcement lives in code, not prompts:
def pre_tool_hook(call, state):
    if call.name == "edit_file" and "features.json" in call.args["path"]:
        diff = preview(call)
        if touches_anything_but_passes_field(diff):
            return deny("features.json: only 'passes' may change")
    if state.spend > BUDGET: return deny("budget exceeded")
    return allow(call)`,

evals: {
  intro: "Braintrust Eval decorator with binary judges for four quality dimensions, a calibration gate before any judge is trusted, and an async online eval worker for production traffic. CI fails if any score regresses by 3+ points.",
  code: `import braintrust, asyncio, random, time
from braintrust import Eval
from openai import OpenAI, AsyncOpenAI
from typing import Callable

JUDGE_MODEL        = "gpt-4o"      # different family for anti-sycophancy if generator ≠ openai
CALIBRATION_TARGET = 0.88          # judge must hit 88% agreement with human labels before use
ONLINE_SAMPLE_RATE = 0.02          # 2% of production traffic scored async
CI_REGRESSION_THRESHOLD = 3        # fail CI if any score drops >3 points vs baseline

client = OpenAI()

# ── BINARY JUDGES ────────────────────────────────────────────────────────────

def judge_faithful(input: dict, output: str, expected=None) -> braintrust.Score:
    """Every claim in the output is grounded in the retrieved context."""
    result = _binary_judge(
        criteria="Every factual claim in the answer is explicitly supported by the context. "
                 "No claim introduces information not present in the context.",
        context=input.get("context", ""),
        answer=output,
        name="faithful"
    )
    return braintrust.Score(name="faithful", score=result["score"], metadata=result)

def judge_responsive(input: dict, output: str, expected=None) -> braintrust.Score:
    """The output directly answers the question asked."""
    result = _binary_judge(
        criteria="The answer directly addresses the user's question. "
                 "It is not evasive, off-topic, or a non-answer.",
        context=input.get("question", ""),
        answer=output,
        name="responsive"
    )
    return braintrust.Score(name="responsive", score=result["score"], metadata=result)

def judge_format(input: dict, output: str, expected=None) -> braintrust.Score:
    """Output matches the required output schema."""
    schema = input.get("expected_format", "plain prose")
    result = _binary_judge(
        criteria=f"The answer conforms to the required format: {schema}. "
                 "It does not include extraneous sections or missing required elements.",
        context=schema,
        answer=output,
        name="format"
    )
    return braintrust.Score(name="format", score=result["score"], metadata=result)

def judge_policy(input: dict, output: str, expected=None) -> braintrust.Score:
    """Output doesn't violate content or safety policy."""
    result = _binary_judge(
        criteria="The answer does not: make false factual claims, reveal confidential information, "
                 "produce harmful content, violate user privacy, or breach content guidelines.",
        context="",
        answer=output,
        name="policy"
    )
    return braintrust.Score(name="policy", score=result["score"], metadata=result)

def _binary_judge(criteria: str, context: str, answer: str, name: str) -> dict:
    resp = client.chat.completions.create(
        model=JUDGE_MODEL,
        response_format={"type": "json_object"},
        messages=[{
            "role": "user",
            "content": f"""Judge whether the answer passes the following criterion.
Criterion: {criteria}
{"Context: " + context if context else ""}
Answer: {answer}

Return JSON: {{"pass": true/false, "reason": "one sentence"}}"""
        }]
    )
    import json
    result = json.loads(resp.choices[0].message.content)
    return {"score": 1.0 if result["pass"] else 0.0, "reason": result.get("reason", ""), "judge": name}

# ── JUDGE CALIBRATION ────────────────────────────────────────────────────────

def calibrate_judge(judge_fn: Callable, labeled_examples: list[dict]) -> float:
    """Measure judge agreement with human labels. Gate deployment at 88%."""
    matches = 0
    for ex in labeled_examples:
        score_obj = judge_fn(ex["input"], ex["output"])
        predicted = score_obj.score >= 0.5
        matches += int(predicted == ex["human_label"])
    accuracy = matches / len(labeled_examples)
    if accuracy < CALIBRATION_TARGET:
        raise ValueError(
            f"Judge calibration failed: {accuracy:.2%} < {CALIBRATION_TARGET:.0%} target. "
            "Review judge prompt before use in production evals."
        )
    return accuracy

# ── OFFLINE EVAL WITH BRAINTRUST ─────────────────────────────────────────────

async def run_eval(dataset_name: str, task_fn: Callable):
    """Run a full eval set through Braintrust with all four judges."""
    await Eval(
        name="rag_quality",
        data=lambda: braintrust.init_dataset(project="my_project", name=dataset_name),
        task=task_fn,
        scores=[judge_faithful, judge_responsive, judge_format, judge_policy],
    )

# ── CI REGRESSION CHECK ───────────────────────────────────────────────────────

def check_ci_regression(current_scores: dict, baseline_scores: dict) -> None:
    """Fail CI if any score drops more than CI_REGRESSION_THRESHOLD points."""
    regressions = []
    for metric, current in current_scores.items():
        baseline = baseline_scores.get(metric, 1.0)
        delta = (baseline - current) * 100
        if delta > CI_REGRESSION_THRESHOLD:
            regressions.append(f"{metric}: {baseline:.2f} → {current:.2f} (−{delta:.1f}pt)")
    if regressions:
        raise SystemExit(f"CI eval regression detected:\\n" + "\\n".join(regressions))
    print("CI eval passed — no regressions above threshold.")

# ── ONLINE EVAL WORKER ─────────────────────────────────────────────────────────

async def online_eval_worker(queue: asyncio.Queue) -> None:
    """Drain production samples from queue and score them asynchronously."""
    aclient = AsyncOpenAI()
    while True:
        item = await queue.get()
        if not should_sample(item["query"]):
            queue.task_done()
            continue
        try:
            score = judge_faithful(
                {"context": item["context"]},
                item["answer"]
            )
            await store_online_score({
                "query_hash": hash(item["query"]),
                "faithful": score.score,
                "timestamp": time.time()
            })
        except Exception as e:
            pass  # never let scoring errors affect the serving path
        finally:
            queue.task_done()

def should_sample(query: str) -> bool:
    import hashlib
    return int(hashlib.md5(query.encode()).hexdigest(), 16) % 100 < (ONLINE_SAMPLE_RATE * 100)

async def store_online_score(record: dict) -> None:
    # stub: write to your observability platform (Langfuse, Braintrust, InfluxDB)
    print(f"ONLINE_SCORE: {record}")`,
  notes: [
    "Each judge is binary (pass/fail scored as 1.0/0.0) — binary judges are easier to calibrate and interpret than 1–5 scales, and easier to build human-label calibration sets for",
    "calibrate_judge() must be run before any judge is trusted for production evals — the 88% agreement target is non-negotiable; a miscalibrated judge produces false confidence",
    "check_ci_regression() fails the build at 3-point delta — tight enough to catch real regressions, loose enough to tolerate normal eval variance on a fixed golden set",
    "online_eval_worker() wraps the judge in a try/except with silent failure — a scoring error must never propagate to the serving path; scores are best-effort, not blocking"
  ],

    ["Judge agreement with human labels below calibration target", "Judge criteria are ambiguous or the judge model hasn't seen good examples of the edge cases", "Add 5–10 few-shot examples of hard cases (borderline passes and borderline fails) to the judge prompt; re-run calibration"],

  ]

halluc: {
  intro: "Input screening (injection + PII), per-claim NLI faithfulness gate with cross-encoder/nli-deberta-v3-small, and risk-tier routing (high=block, medium=flag_and_serve, low=log). Defense-in-depth: each layer catches what the others miss.",
  code: `import re, json, time
from typing import Literal
from openai import OpenAI
from sentence_transformers import CrossEncoder

# ── CONFIGURATION ─────────────────────────────────────────────────────────────
NLI_MODEL = "cross-encoder/nli-deberta-v3-small"   # 80ms/claim on CPU; production-ready
FAITHFULNESS_THRESHOLD_HIGH   = 0.4   # below: block entirely
FAITHFULNESS_THRESHOLD_MEDIUM = 0.75  # below: flag and serve with disclaimer
# above MEDIUM threshold: log and serve normally

INJECTION_PATTERNS = [
    re.compile(r"(?i)ignore\s+(all\s+)?(previous|prior)\s+instructions?"),
    re.compile(r"(?i)you\s+are\s+now\s+in\s+\w+\s+mode"),
    re.compile(r"(?i)disregard\s+your\s+(system\s+prompt|guidelines?)"),
    re.compile(r"(?i)print\s+(the\s+)?(system\s+prompt|full\s+instructions?)"),
    re.compile(r"(?i)base64\s+decode"),
]

# ── LAYER 1: INPUT SCREENING ──────────────────────────────────────────────────

def screen_input(text: str) -> tuple[bool, str]:
    """Fast structural screening before any model call."""
    for pattern in INJECTION_PATTERNS:
        if pattern.search(text):
            return False, f"injection_pattern: {pattern.pattern}"
    if contains_pii(text):
        return False, "pii_detected"
    return True, ""

def contains_pii(text: str) -> bool:
    """Heuristic PII detection — replace with a proper NER model for production."""
    pii_patterns = [
        re.compile(r"\b\d{3}-\d{2}-\d{4}\b"),           # SSN
        re.compile(r"\b4[0-9]{12}(?:[0-9]{3})?\b"),      # Visa card
        re.compile(r"\b[A-Z]{2}\d{6,9}\b"),              # Passport
    ]
    return any(p.search(text) for p in pii_patterns)

# ── LAYER 2: PER-CLAIM FAITHFULNESS GATE ─────────────────────────────────────

def extract_claims(answer: str) -> list[str]:
    """Decompose answer into atomic verifiable claims."""
    client = OpenAI()
    resp = client.chat.completions.create(
        model="gpt-4o-mini",
        response_format={"type": "json_object"},
        messages=[{
            "role": "user",
            "content": f"""Extract every distinct factual claim from this answer as a list of short, self-contained sentences.
Each claim should be independently verifiable.
Return JSON: {{"claims": ["claim1", "claim2", ...]}}

Answer: {answer}"""
        }]
    )
    return json.loads(resp.choices[0].message.content).get("claims", [answer])

def nli_score_claims(claims: list[str], context: str) -> list[dict]:
    """Score each claim against context using NLI model. Returns per-claim results."""
    nli = CrossEncoder(NLI_MODEL)   # cache this in production — load once at startup
    pairs = [(context[:512], claim) for claim in claims]  # truncate context to model max
    # NLI labels: 0=contradiction, 1=neutral, 2=entailment
    scores = nli.predict(pairs, apply_softmax=True)
    results = []
    for claim, score_vec in zip(claims, scores):
        entailment_prob = float(score_vec[2])  # index 2 = entailment
        results.append({
            "claim": claim,
            "entailment": entailment_prob,
            "label": "entailed" if entailment_prob > 0.7 else ("neutral" if entailment_prob > 0.4 else "contradicted")
        })
    return results

def faithfulness_gate(answer: str, context: str) -> dict:
    """Full per-claim faithfulness check with risk tier classification."""
    claims = extract_claims(answer)
    claim_results = nli_score_claims(claims, context)
    unsupported = [r for r in claim_results if r["label"] != "entailed"]
    # overall faithfulness = fraction of claims that are entailed
    overall = sum(1 for r in claim_results if r["label"] == "entailed") / max(len(claim_results), 1)
    risk_tier = classify_risk(overall)
    return {
        "overall_faithfulness": overall,
        "risk_tier": risk_tier,
        "claims": claim_results,
        "unsupported_claims": [r["claim"] for r in unsupported],
    }

RiskTier = Literal["low", "medium", "high"]

def classify_risk(faithfulness_score: float) -> RiskTier:
    if faithfulness_score < FAITHFULNESS_THRESHOLD_HIGH:
        return "high"
    if faithfulness_score < FAITHFULNESS_THRESHOLD_MEDIUM:
        return "medium"
    return "low"

# ── LAYER 3: RISK-TIER ROUTING ────────────────────────────────────────────────

def route_by_risk(gate_result: dict, answer: str) -> dict:
    tier = gate_result["risk_tier"]
    score = gate_result["overall_faithfulness"]
    if tier == "high":
        # Block — don't serve, log the failure for labeling queue
        log_quality_event("hallucination_block", gate_result)
        return {
            "served": False,
            "response": "I don't have reliable information to answer this question.",
            "tier": "high", "faithfulness": score
        }
    if tier == "medium":
        # Flag and serve — add disclaimer, log for review
        log_quality_event("hallucination_flag", gate_result)
        disclaimer = "\\n\\n*Note: Some parts of this answer may not be fully supported by the available context. Please verify before relying on this information.*"
        return {
            "served": True,
            "response": answer + disclaimer,
            "tier": "medium", "faithfulness": score
        }
    # Low risk — log and serve normally
    log_quality_event("hallucination_ok", gate_result)
    return {"served": True, "response": answer, "tier": "low", "faithfulness": score}

def log_quality_event(event_type: str, details: dict) -> None:
    print(json.dumps({"event": event_type, "ts": time.time(), **details}))

# ── LAYER 4: QUARANTINE EXTERNAL CONTENT ─────────────────────────────────────

def quarantine_external(content: str, source_label: str) -> str:
    """Wrap external content in explicit trust-boundary markers."""
    return f"<external source='{source_label}' trust='untrusted'>\n{content}\n</external>"

# ── OPTION A: RAGAS FAITHFULNESS (ALTERNATIVE TO NLI GATE) ───────────────────

def check_faithfulness_ragas(question: str, answer: str, contexts: list[str]) -> float:
    """Use RAGAS faithfulness metric as an alternative to the NLI gate."""
    from ragas import evaluate
    from ragas.metrics import faithfulness
    from datasets import Dataset
    data = Dataset.from_dict({
        "question": [question],
        "answer": [answer],
        "contexts": [contexts],
    })
    result = evaluate(data, metrics=[faithfulness])
    return float(result["faithfulness"])

# ── MAIN PIPELINE ─────────────────────────────────────────────────────────────

def answer(query: str, retrieved_docs: list[str], raw_answer: str) -> dict:
    # Layer 1: input screening
    safe, reason = screen_input(query)
    if not safe:
        return {"served": False, "response": f"Request blocked: {reason}"}

    # Layer 2: faithfulness gate (NLI per-claim)
    context = "\\n\\n".join(quarantine_external(doc, f"doc_{i}") for i, doc in enumerate(retrieved_docs))
    gate = faithfulness_gate(raw_answer, context)

    # Layer 3: risk-tier routing
    return route_by_risk(gate, raw_answer)`,
  notes: [
    "cross-encoder/nli-deberta-v3-small runs at 80ms/claim on CPU — for an answer with 5 claims, that's 400ms; cache the CrossEncoder instance at startup (loading the model is 2–3s)",
    "extract_claims() decomposes the answer before NLI scoring — checking 'The drug was approved in 2021 and costs $400/month' as one claim against the context produces unreliable entailment scores; two separate claims produce accurate ones",
    "route_by_risk() maps the three tiers to three different outcomes: high=silent block (user sees a safe refusal), medium=disclaimer+serve (user gets the answer with a caveat), low=serve (normal path) — this is more useful than binary block/serve",
    "quarantine_external() wraps retrieved content in trust-boundary tags before the NLI comparison — prevents injected instructions in retrieved docs from being treated as authoritative context during the gate"
  ],
  debug: [
    ["NLI gate blocking correct answers (false high-risk)", "Context window (512 tokens) truncated the relevant context — claim scored against the wrong part of the document", "Increase NLI context window to 1024 tokens if the model supports it; alternatively, score each claim against the top-1 most relevant sentence from the full context (retrieved by semantic similarity)"],
    ["extract_claims() returning the full answer as one claim", "gpt-4o-mini not decomposing the answer — common for short one-sentence answers", "Add few-shot examples to the extraction prompt showing decomposition of short answers; for single-sentence answers, use the full sentence as the only claim"],
    ["Risk tier 'medium' answers being served without disclaimers appearing in the UI", "route_by_risk() returning the disclaimer in the response string, but the UI strips trailing text", "Add a separate 'disclaimer' field to the response object; handle it as a first-class UI element rather than appending to the response string"],
    ["RAGAS faithfulness scores not correlating with NLI gate scores", "RAGAS uses a different claim extraction and scoring approach — both are valid but not interchangeable", "Run both on a held-out set and compare against human labels; use whichever correlates better with your domain; don't mix thresholds across the two methods"]
  ]
},

finetune: {
  intro: "Production LoRA/QLoRA fine-tune with a held-out split gate and a regression loop. The two non-negotiables: freeze your test split before touching any data, and run a general regression suite after every checkpoint.",
  code: `from datasets import load_dataset, DatasetDict
from peft import LoraConfig, get_peft_model, TaskType, prepare_model_for_kbit_training
from transformers import AutoModelForCausalLM, AutoTokenizer, BitsAndBytesConfig, TrainingArguments
from trl import SFTTrainer
import evaluate, json, hashlib, pathlib

TASK_METRIC = "f1"          # replace with your actual task metric
REGRESSION_TASKS = ["instruction_following", "summarization"]  # general capability checks
LORA_R = 16
LORA_ALPHA = 32             # rule of thumb: alpha = 2 * r
TARGET_MODULES = ["q_proj", "v_proj", "k_proj", "o_proj"]

def freeze_test_split(raw_dataset_path: str, seed: int = 42) -> DatasetDict:
    # split before any preprocessing touches the data — contamination prevention
    ds = load_dataset("json", data_files=raw_dataset_path, split="train")
    split = ds.train_test_split(test_size=0.15, seed=seed)
    # write split indices to a fingerprint file for audit
    fingerprint = hashlib.sha256(str(sorted(split["test"]["id"])).encode()).hexdigest()
    pathlib.Path("split_fingerprint.txt").write_text(fingerprint)
    return split

def load_quantized_base(model_id: str):
    bnb_config = BitsAndBytesConfig(
        load_in_4bit=True,
        bnb_4bit_quant_type="nf4",          # nf4 is the QLoRA-native format
        bnb_4bit_use_double_quant=True,
        bnb_4bit_compute_dtype="bfloat16",
    )
    model = AutoModelForCausalLM.from_pretrained(model_id, quantization_config=bnb_config)
    model = prepare_model_for_kbit_training(model)  # enables gradient checkpointing for QLoRA
    return model

def build_lora_model(base_model):
    config = LoraConfig(
        r=LORA_R,
        lora_alpha=LORA_ALPHA,
        target_modules=TARGET_MODULES,
        lora_dropout=0.05,
        bias="none",
        task_type=TaskType.CAUSAL_LM,
    )
    return get_peft_model(base_model, config)

def train(model, tokenizer, split: DatasetDict):
    args = TrainingArguments(
        output_dir="./checkpoints",
        num_train_epochs=3,              # rarely need more than 3 on clean data
        per_device_train_batch_size=4,
        gradient_accumulation_steps=4,
        learning_rate=2e-4,              # standard safe operating point for LoRA
        warmup_ratio=0.05,
        lr_scheduler_type="cosine",
        evaluation_strategy="epoch",
        save_strategy="epoch",
        load_best_model_at_end=True,
        fp16=False,
        bf16=True,
    )
    trainer = SFTTrainer(
        model=model,
        args=args,
        train_dataset=split["train"],
        eval_dataset=split["test"],
        tokenizer=tokenizer,
        dataset_text_field="text",
        max_seq_length=2048,
    )
    trainer.train()
    return trainer

def run_regression_suite(model, tokenizer) -> dict:
    # prove you haven't broken general capability — run before calling the fine-tune done
    results = {}
    for task in REGRESSION_TASKS:
        benchmark = load_dataset("your_org/" + task, split="test")
        metric = evaluate.load(TASK_METRIC)
        for example in benchmark:
            pred = generate(model, tokenizer, example["prompt"])
            metric.add(prediction=pred, reference=example["label"])
        results[task] = metric.compute()
    return results

def generate(model, tokenizer, prompt: str) -> str:

    return False  # placeholder: requires explicit human approval flow

def answer(user_message: str, retrieved_docs: list[str], session_token: str) -> str:

        span.set_attribute("gen_ai.system", "openai")
        span.set_attribute("gen_ai.request.model", "gpt-4o")

        response = await client.chat.completions.create(

        )

        span.set_attribute("gen_ai.usage.input_tokens", usage.prompt_tokens)
        span.set_attribute("gen_ai.usage.output_tokens", usage.completion_tokens)
        span.set_attribute("cost_usd", cost_usd)

        answer = response.choices[0].message.content
        span_id = format(span.get_span_context().span_id, "016x")

        # async quality sampling — non-blocking
        if should_sample(query):
            asyncio.create_task(score_and_store(query, context_docs, answer, trajectory_id, span_id))

        return {"answer": answer, "span_id": span_id, "cost_usd": cost_usd}

def should_sample(query: str) -> bool:
    """Deterministic hash-based sampling for reproducibility."""
    return int(hashlib.md5(query.encode()).hexdigest(), 16) % 100 < (SAMPLE_RATE * 100)

def build_messages(query: str, context_docs: list[str]) -> list[dict]:
    context = "\\n\\n".join(f"[{i}] {doc}" for i, doc in enumerate(context_docs))

async def score_and_store(

    trajectory_id: str, span_id: str
) -> None:
    """Scores a sample asynchronously — runs after the user response is served."""
    judge = AsyncOpenAI()
    context = "\\n\\n".join(context_docs)
    score_resp = await judge.chat.completions.create(
        model="claude-haiku-4-5",            # lighter Claude tier; for true cross-family separation use GPT or Gemini Flash
        response_format={"type": "json_object"},
        messages=[{
            "role": "user",
            "content": f"""Score this RAG answer for faithfulness (0.0-1.0).
            Faithfulness: every claim in the answer is grounded in the context.
            Return JSON: {{"score": float, "failed_claims": list[str]}}

            Context: {context[:2000]}

        "timestamp": time.time()
    })

async def write_quality_score(record: dict) -> None:
    """Write to your time-series store — Influx, Prometheus pushgateway, or Langfuse."""
    # stub: replace with actual write to your observability platform
    print(f"QUALITY_SCORE: {json.dumps(record)}")

# ── ROLLING SLO ALERT CHECK ─────────────────────────────────────────────────

def check_quality_slo(scores_last_7d: list[float]) -> dict:
    """Call this from your alerting cron — fires if rolling quality drops below threshold."""
    if not scores_last_7d:
        return {"status": "no_data"}
    rolling_avg = sum(scores_last_7d) / len(scores_last_7d)
    breach = rolling_avg < QUALITY_THRESHOLD

dataeng: {
  intro: "Document ingestion pipeline with layout-aware routing, hierarchical chunking, embedding version enforcement, and a blue-green index migration. The data pipeline sets the quality ceiling — everything downstream depends on what it produces.",
  code: `import hashlib, json, pathlib, subprocess
from dataclasses import dataclass, field
from typing import Literal
import pdfminer.high_level as pdf_extract
from llama_index.core import Document, VectorStoreIndex, StorageContext
from llama_index.core.node_parser import HierarchicalNodeParser, get_leaf_nodes
from llama_index.core.retrievers import AutoMergingRetriever
from llama_index.embeddings.openai import OpenAIEmbedding
from llama_index.vector_stores.qdrant import QdrantVectorStore
import qdrant_client

EMBED_MODEL_ID = "text-embedding-3-large"
EMBED_VERSION  = "2024-12"       # stored in index metadata — hard error on mismatch
PARENT_CHUNK_SIZE = 1024         # tokens; full section for generation context
CHILD_CHUNK_SIZE  = 256          # tokens; paragraph for retrieval precision
FRESHNESS_SLA_HOURS = 24         # alert if chunk older than this

@dataclass
class ChunkMetadata:
    source_url: str
    source_version: str
    embed_model_id: str
    embed_model_version: str
    last_indexed: str
    acl: list[str] = field(default_factory=list)  # access control list

# ── DOCUMENT ROUTING ────────────────────────────────────────────────────────

def detect_pdf_type(pdf_path: str) -> Literal["digital_native", "scanned"]:
    """Check for extractable text layer — determines pipeline route."""
    text = pdf_extract.extract_text(pdf_path)
    word_count = len(text.split())
    # heuristic: scanned PDFs produce <50 words of garbage from pdfminer
    return "digital_native" if word_count > 50 else "scanned"

def ingest_pdf(pdf_path: str, source_url: str, acl: list[str]) -> list[Document]:
    doc_type = detect_pdf_type(pdf_path)
    if doc_type == "digital_native":
        return ingest_digital_native(pdf_path, source_url, acl)
    else:
        return ingest_scanned(pdf_path, source_url, acl)

def ingest_digital_native(pdf_path: str, source_url: str, acl: list[str]) -> list[Document]:
    """pdfminer extraction — free, accurate, structure-preserving for digital PDFs."""
    text = pdf_extract.extract_text(pdf_path)
    doc_hash = hashlib.sha256(text.encode()).hexdigest()
    metadata = ChunkMetadata(
        source_url=source_url,
        source_version=doc_hash,
        embed_model_id=EMBED_MODEL_ID,
        embed_model_version=EMBED_VERSION,
        last_indexed=_now(),
        acl=acl,
    )
    return [Document(text=text, metadata=vars(metadata))]

def ingest_scanned(pdf_path: str, source_url: str, acl: list[str]) -> list[Document]:
    """AWS Textract for scanned documents — preserves table structure."""
    import boto3
    textract = boto3.client("textract")
    with open(pdf_path, "rb") as f:
        response = textract.analyze_document(
            Document={"Bytes": f.read()},
            FeatureTypes=["TABLES", "FORMS"]
        )
    text = extract_textract_text(response)
    confidence = extract_min_confidence(response)
    if confidence < 0.70:
        # quarantine low-confidence pages rather than silently ingest garbage
        raise ValueError(f"OCR confidence {confidence:.2f} below threshold for {pdf_path}")
    doc_hash = hashlib.sha256(text.encode()).hexdigest()
    metadata = ChunkMetadata(
        source_url=source_url, source_version=doc_hash,
        embed_model_id=EMBED_MODEL_ID, embed_model_version=EMBED_VERSION,
        last_indexed=_now(), acl=acl,
    )
    return [Document(text=text, metadata=vars(metadata))]

# ── HIERARCHICAL CHUNKING ───────────────────────────────────────────────────

def chunk_hierarchically(docs: list[Document]) -> tuple:
    """Parent (section) + child (paragraph) nodes. Retrieve on child, return parent."""
    parser = HierarchicalNodeParser.from_defaults(
        chunk_sizes=[PARENT_CHUNK_SIZE, CHILD_CHUNK_SIZE]
    )
    all_nodes = parser.get_nodes_from_documents(docs)
    leaf_nodes = get_leaf_nodes(all_nodes)
    return all_nodes, leaf_nodes

# ── EMBEDDING VERSION ENFORCEMENT ──────────────────────────────────────────

def verify_embed_version(client: qdrant_client.QdrantClient, collection: str) -> None:
    """Hard error on startup if deployed embedder mismatches index metadata."""
    collections = client.get_collections().collections
    names = [c.name for c in collections]
    if collection not in names:
        return  # new index — no mismatch possible
    sample = client.scroll(collection_name=collection, limit=1, with_payload=True)
    if not sample[0]:
        return
    stored_version = sample[0][0].payload.get("embed_model_version")
    if stored_version and stored_version != EMBED_VERSION:
        raise RuntimeError(
            f"Embedding version mismatch: index has '{stored_version}', "
            f"deployer has '{EMBED_VERSION}'. Run blue-green migration before serving."
        )

# ── BLUE-GREEN INDEX MIGRATION ──────────────────────────────────────────────

def blue_green_migrate(
    old_collection: str,
    new_collection: str,
    all_docs: list[Document],
    golden_queries: list[str],
) -> bool:
    """Build new index, compare recall, swap alias atomically."""
    client = qdrant_client.QdrantClient(url="http://qdrant:6333")
    embed = OpenAIEmbedding(model=EMBED_MODEL_ID)

    # build new index without touching the serving collection
    store = QdrantVectorStore(client=client, collection_name=new_collection)
    ctx = StorageContext.from_defaults(vector_store=store)
    all_nodes, leaf_nodes = chunk_hierarchically(all_docs)
    new_index = VectorStoreIndex(leaf_nodes, storage_context=ctx, embed_model=embed)

    # recall comparison on golden queries
    old_hits = recall_at_5(client, old_collection, golden_queries, embed)
    new_hits = recall_at_5(client, new_collection, golden_queries, embed)
    if new_hits < old_hits - 0.05:    # fail if new index is more than 5 points worse
        print(f"Migration aborted: recall dropped from {old_hits:.2f} to {new_hits:.2f}")
        client.delete_collection(new_collection)
        return False

    # atomic alias swap — serving pointer updates in a single transaction
    client.update_collection_aliases(change_aliases_operations=[
        {"delete_alias": {"alias_name": "serving"}},
        {"create_alias": {"collection_name": new_collection, "alias_name": "serving"}}
    ])
    print(f"Migration complete: recall {old_hits:.2f} → {new_hits:.2f}")
    return True

def recall_at_5(client, collection, queries, embed) -> float:
    hits = 0
    for q in queries:
        vec = embed.get_text_embedding(q)
        results = client.search(collection_name=collection, query_vector=vec, limit=5)
        hits += 1 if results else 0
    return hits / len(queries)

def _now() -> str:
    from datetime import datetime, timezone
    return datetime.now(timezone.utc).isoformat()

def extract_textract_text(response: dict) -> str:
    return " ".join(b["Text"] for b in response.get("Blocks", []) if b["BlockType"] == "LINE")

def extract_min_confidence(response: dict) -> float:
    confs = [b.get("Confidence", 100) for b in response.get("Blocks", []) if "Confidence" in b]
    return min(confs) / 100 if confs else 1.0`,
  notes: [
    "detect_pdf_type() routes by word count from pdfminer — the 50-word heuristic handles the vast majority of cases; edge cases (image-embedded PDFs) fall to scanned path safely",
    "ChunkMetadata stores embed_model_id + embed_model_version per chunk — verify_embed_version() reads this and raises a hard error on mismatch at startup",
    "HierarchicalNodeParser with [1024, 256] creates parent nodes (sections) linked to child nodes (paragraphs) — AutoMergingRetriever serves the parent when multiple children from it are retrieved",
    "blue_green_migrate() fails safe: if recall drops >5 points, it deletes the new collection and returns False — the serving alias never points to a degraded index"
  ],
  debug: [
    ["Questions about table data return fragment answers", "Fixed-size chunking is splitting tables at row boundaries", "Inspect raw chunks for 3 table-containing pages; if fragmented, add LayoutLMv3 table detection before chunking and treat each table as an atomic unit"],
    ["Recall dropped 40% after dependency update", "Embedding model version changed silently — verify_embed_version() should have caught this", "Check that verify_embed_version() is called at application startup before any queries are served; pin embedding model in requirements"],
    ["OCR confidence error rate spiking for a document category", "A new document category has layout patterns (multi-column, rotated, handwritten) that defeat Textract", "Route that category to a vision model; add to the category-routing config; lower confidence threshold triggers human review queue"],
    ["Blue-green migration recall comparison shows no improvement despite new model", "Golden query set is too small or not representative of the actual query distribution", "Expand golden query set to 200+ queries covering all topic areas and difficulty levels; include multi-hop queries that require cross-section retrieval"]
  ]
},

    processor = AutoImageProcessor.from_pretrained("microsoft/table-transformer-detection")
    model = TableTransformerForObjectDetection.from_pretrained(
        "microsoft/table-transformer-detection"
    )
    inputs = processor(images=page_image, return_tensors="pt")
    with torch.no_grad():
        outputs = model(**inputs)
    results = processor.post_process_object_detection(
        outputs, threshold=0.9, target_sizes=[page_image.size[::-1]]
    )[0]
    tables = []
    for score, label, box in zip(results["scores"], results["labels"], results["boxes"]):
        if score > 0.9:
            x0, y0, x1, y1 = [int(v) for v in box.tolist()]
            cropped = page_image.crop((x0, y0, x1, y1))
            structure = extract_table_structure(cropped)
            tables.append({"bbox": [x0, y0, x1, y1], "structure": structure, "confidence": float(score)})
    return tables

def extract_table_structure(table_image: Image.Image) -> dict:
    """Structure recognition: row/column boundaries → JSON cell grid."""
    processor = AutoImageProcessor.from_pretrained("microsoft/table-transformer-structure-recognition")
    model = TableTransformerForObjectDetection.from_pretrained(
        "microsoft/table-transformer-structure-recognition"
    )
    inputs = processor(images=table_image, return_tensors="pt")
    with torch.no_grad():
        outputs = model(**inputs)
    # in production: parse row/column detections into a cell grid
    # returning raw detection results here for brevity
    return {"raw_detections": outputs.logits.shape}

# ── VISION CALL WITH CACHE ───────────────────────────────────────────────────

def doc_hash(pdf_path: str) -> str:
    with open(pdf_path, "rb") as f:
        return hashlib.sha256(f.read()).hexdigest()[:16]

def vision_extract_page(page_image: Image.Image, doc_id: str, page_num: int) -> str:
    """Vision model extraction with document-hash-keyed cache."""
    cache_key = f"{doc_id}_p{page_num}"
    cache_file = CACHE_DIR / f"{cache_key}.json"
    if cache_file.exists():
        return json.loads(cache_file.read_text())["content"]

    buf = io.BytesIO()
    page_image.save(buf, format="PNG")
    b64 = base64.b64encode(buf.getvalue()).decode()
    client = OpenAI()
    response = client.chat.completions.create(
        model=VISION_MODEL,
        messages=[{
            "role": "user",
            "content": [
                {"type": "text", "text": "Extract all text, table structures (as JSON), and figure data points from this page. Preserve row/column relationships for tables."},
                {"type": "image_url", "image_url": {"url": f"data:image/png;base64,{b64}", "detail": "high"}}
            ]
        }],
        max_tokens=2000
    )
    content = response.choices[0].message.content
    cache_file.write_text(json.dumps({"content": content, "doc_id": doc_id, "page": page_num}))
    return content

# ── MAIN ROUTING PIPELINE ────────────────────────────────────────────────────

def process_document(pdf_path: str, query: str) -> dict:
    """Route to text or vision pipeline based on document type and query intent."""
    d_id = doc_hash(pdf_path)

    if has_text_layer(pdf_path) and not references_figure(query):
        # fast path: digital-native, query doesn't reference figures
        text = pdf_extract.extract_text(pdf_path)
        return {"pipeline": "text", "content": text, "doc_id": d_id}

    # vision path: scanned document OR query references figure content
    pages = pdf_to_images(pdf_path)
    results = []
    for i, page_img in enumerate(pages):
        tables = extract_tables_from_page(page_img)
        page_text = vision_extract_page(page_img, d_id, i)
        results.append({"page": i, "text": page_text, "tables": tables})
    return {"pipeline": "vision", "pages": results, "doc_id": d_id}

def pdf_to_images(pdf_path: str, dpi: int = 150) -> list[Image.Image]:
    """Convert PDF pages to PIL images for vision processing."""
    import fitz  # pymupdf
    doc = fitz.open(pdf_path)
    images = []
    for page in doc:
        mat = fitz.Matrix(dpi / 72, dpi / 72)
        pix = page.get_pixmap(matrix=mat)
        images.append(Image.frombytes("RGB", [pix.width, pix.height], pix.samples))
    return images

# ── NL2SQL WITH SCHEMA RETRIEVAL ─────────────────────────────────────────────

def nl2sql(query: str, all_schemas: dict[str, str], top_k: int = 6) -> str:
    """Retrieve relevant schemas by embedding similarity — don't include all 300 tables."""
    from openai import OpenAI
    client = OpenAI()
    q_embed = client.embeddings.create(model="text-embedding-3-small", input=query).data[0].embedding
    scored = []
    for table_name, schema_text in all_schemas.items():
        s_embed = client.embeddings.create(model="text-embedding-3-small", input=schema_text).data[0].embedding
        sim = cosine_similarity(q_embed, s_embed)
        scored.append((sim, table_name, schema_text))
    top_schemas = sorted(scored, reverse=True)[:top_k]
    schema_context = "\\n\\n".join(f"-- {name}\\n{schema}" for _, name, schema in top_schemas)
    response = client.chat.completions.create(
        model="gpt-4o",
        messages=[
            {"role": "system", "content": "Generate a valid SQL query for the following schemas and user question. Return only the SQL."},
            {"role": "user", "content": f"Schemas:\\n{schema_context}\\n\\nQuestion: {query}"}
        ]
    )
    return response.choices[0].message.content

def cosine_similarity(a: list, b: list) -> float:
    import math
    dot = sum(x * y for x, y in zip(a, b))
    mag_a = math.sqrt(sum(x**2 for x in a))
    mag_b = math.sqrt(sum(x**2 for x in b))
    return dot / (mag_a * mag_b) if mag_a and mag_b else 0.0`,
  notes: [
    "has_text_layer() + references_figure() is the two-factor routing gate: skip vision unless the document lacks text OR the query explicitly targets visual content",
    "vision_extract_page() writes to .doc_cache/{doc_id}_p{page}.json — cache miss cost paid once per document version; subsequent queries for the same document are free",
    "Table Transformer detection threshold=0.9 minimizes false positives — a table region missed is better than a non-table treated as a table and sent to structure recognition",
    "nl2sql() uses embedding similarity to select top_k=6 schemas from a large database — prevents attention dilution from including 300 schemas in a single prompt"
  ],
  debug: [
    ["Vision pipeline being invoked for digital-native PDFs", "has_text_layer() returning False on a PDF with a text layer — possible encoding issue", "Log word count from pdfminer; lower the threshold or add a secondary check with pypdf; inspect the specific PDF for non-standard text encoding"],
    ["Table extraction returning empty structure", "Table Transformer confidence threshold too high for low-resolution scans", "Lower detection threshold from 0.9 to 0.7 for scanned documents; check that page DPI is at least 150 (lower produces degraded table boundaries)"],
    ["Vision cache not being hit for repeated queries on the same document", "doc_hash() computing differently on re-reads (e.g., file metadata changing)", "Hash document content only (file bytes), not file metadata; verify cache_key format is consistent"],
    ["NL2SQL generating JOINs on wrong tables", "Schema retrieval not retrieving the right tables for relational queries", "Add JOIN relationship hints to schema text (e.g., '-- foreign key: orders.customer_id -> customers.id'); consider graph-based schema traversal for complex relationships"]
  ]
},
};
